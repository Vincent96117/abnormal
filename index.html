<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V5.7.4 - QUICK RESPONSE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; cursor: pointer; transition: all 0.3s; }
        .hunt-trigger { border: 2px solid #a855f7 !important; background: #1e1b4b !important; animation: pulse-purple 1.5s infinite; }
        .flash-trigger { border: 2px solid #facc15 !important; background: #422006 !important; animation: pulse-yellow 0.8s infinite; }
        .pinned { border: 2px solid #3b82f6 !important; background: #081221 !important; }
        @keyframes pulse-purple { 0%, 100% { box-shadow: 0 0 5px #a855f7; } 50% { box-shadow: 0 0 20px #a855f7; } }
        @keyframes pulse-yellow { 0%, 100% { box-shadow: 0 0 5px #facc15; } 50% { box-shadow: 0 0 20px #facc15; } }
        .toggle-active { background: #ef4444 !important; color: white !important; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[11px]">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="bg-zinc-900 p-4 rounded-xl mb-4 border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col">
                    <h1 class="text-xl font-black text-blue-500 italic uppercase">⚡ Sniper V5.7.4 <span id="heartbeat" class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span></h1>
                    <div class="text-[9px] text-zinc-500 font-bold mt-1 uppercase tracking-widest">Status: <span id="load_status" class="text-white italic">WARMING DATA...</span></div>
                </div>
                <div class="flex gap-2">
                    <button id="slopeToggle" onclick="toggleFilter('USE_FUEL')" class="bg-black border border-zinc-700 px-3 py-2 rounded-lg font-black text-zinc-400 text-[10px] toggle-active">⚓ Fuel Filter: ON</button>
                    <input type="text" id="searchInput" onkeydown="handleSearch(event)" placeholder="SYMBOL & ENTER" class="bg-black border-2 border-zinc-800 px-3 py-1 rounded text-blue-400 outline-none w-40 uppercase font-black transition-all">
                </div>
            </div>
            <div class="grid grid-cols-3 gap-6 font-black uppercase">
                <div class="space-y-1"><div class="flex justify-between text-red-500"><span>📉 Slope Limit</span><span id="slp_val">-2.5%</span></div><input type="range" id="slp_range" min="-800" max="0" value="-25" class="w-full h-1 bg-zinc-800 appearance-none cursor-pointer"></div>
                <div class="space-y-1"><div class="flex justify-between text-yellow-500"><span>🔥 Volat / Flash</span><span id="volat_val">15%</span></div><input type="range" id="volat_range" min="1" max="50" value="15" class="w-full h-1 bg-zinc-800 appearance-none cursor-pointer"></div>
                <div class="space-y-1"><div class="flex justify-between text-blue-400"><span>💎 Vacuum Score</span><span id="vac_val">80</span></div><input type="range" id="vac_range" min="10" max="500" value="80" class="w-full h-1 bg-zinc-800 appearance-none cursor-pointer"></div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pr-2"></div>
    </div>
    <div class="w-72 bg-zinc-950 border-l border-zinc-900 flex flex-col p-4 text-[10px]">
        <div class="text-zinc-600 font-black mb-4 border-b border-zinc-800 pb-2 uppercase text-center italic">Live Signals</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-2"></div>
    </div>

<script>
    const P_USER = "Gkhqyhobnxzjfwgvaiyp347m1jkhn4", P_TOKEN = "acyoe3sz15x4n91r1349fdcau7x6pw";
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    const DEPTH = 1200, MEMORY = 180000; 
    let stats = {}, pinned = new Set(), currentKeyword = "";
    let SETTINGS = { SLP: -0.025, VOLAT_RATIO: 0.15, VAC: 80, USE_FUEL: true };
    let isUpdating = false;

    function handleSearch(e) {
        if (e.key === 'Enter') {
            currentKeyword = e.target.value.toUpperCase();
            e.target.style.borderColor = currentKeyword ? '#3b82f6' : '#27272a';
            addLog(`SEARCH: ${currentKeyword || 'ALL'}`, "text-blue-400 font-black");
        }
    }

    function toggleFilter(key) { SETTINGS[key] = !SETTINGS[key]; const btn = document.getElementById('slopeToggle'); btn.classList.toggle('toggle-active'); btn.innerText = `⚓ Fuel Filter: ${SETTINGS[key]?'ON':'OFF'}`; }

    function addLog(msg, color="text-zinc-500") {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = `border-l-2 border-zinc-800 pl-2 py-1 ${color}`;
        div.innerHTML = `[${new Date().toLocaleTimeString('zh-TW',{hour12:false})}] ${msg}`;
        logs.prepend(div);
        if (logs.children.length > 50) logs.lastChild.remove();
    }

    async function update() {
        if (isUpdating) return;
        isUpdating = true;
        document.getElementById('heartbeat').classList.toggle('opacity-0');
        try {
            const [fRes, tRes] = await Promise.all([
                fetch('https://fapi.binance.com/fapi/v1/premiumIndex'),
                fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')
            ]);
            const fData = await fRes.json(), tData = await tRes.json();
            const tMap = new Map(tData.map(t => [t.symbol, t]));
            let results = [];

            fData.forEach(c => {
                const s = c.symbol;
                if (!s.endsWith('USDT') || EXCLUDE.includes(s)) return;
                const ticker = tMap.get(s); if (!ticker) return;
                const pNow = parseFloat(ticker.lastPrice), fNow = parseFloat(c.lastFundingRate), vNow = parseFloat(ticker.quoteVolume);
                const h24 = parseFloat(ticker.highPrice), l24 = parseFloat(ticker.lowPrice);
                
                if (!stats[s]) stats[s] = { lastV: vNow, vDeltas:[], frHist:[], pHist:[], pvDeltas:[], lastTrigger:0, logged:false };
                
                const vDelta = Math.max(0, vNow - stats[s].lastV);
                stats[s].lastV = vNow;
                stats[s].vDeltas.push(vDelta);
                stats[s].pvDeltas.push(pNow * vDelta);
                stats[s].frHist.push(fNow);
                stats[s].pHist.push(pNow);
                if (stats[s].frHist.length > DEPTH) {
                    stats[s].vDeltas.shift(); stats[s].pvDeltas.shift(); stats[s].frHist.shift(); stats[s].pHist.shift();
                }

                const dataLen = stats[s].frHist.length;
                if (dataLen < 50) return; // 稍微降低熱機門檻到 2.5 分鐘

                const p5m = stats[s].pHist.slice(-100);
                const range5m = Math.max(...p5m) - Math.min(...p5m);
                const v5mSum = Math.max(0.0001, stats[s].vDeltas.slice(-100).reduce((a,b)=>a+b,0));
                const vwap5m = stats[s].pvDeltas.slice(-100).reduce((a,b)=>a+b,0) / v5mSum;
                const p15m = stats[s].pHist.slice(-300);
                const bgVolat = (Math.max(...p15m) - Math.min(...p15m)) / pNow;

                const slope = (fNow - stats[s].frHist[dataLen-100]) / (Math.abs(stats[s].frHist[dataLen-100]) || 0.0001);
                const vacScore = (range5m / v5mSum) * 100000000;
                const flashRatio = (pNow - (stats[s].pHist[dataLen-20] || stats[s].pHist[0])) / (h24 - l24 || 1);

                // 2.2 倍蓄力，更靈敏
                const isFlash = (flashRatio >= SETTINGS.VOLAT_RATIO) && (flashRatio > bgVolat * 2.2) && (vacScore >= SETTINGS.VAC);
                const isFuel = (range5m/(h24-l24||1) >= SETTINGS.VOLAT_RATIO) && (pNow > vwap5m) && (!SETTINGS.USE_FUEL || (slope <= SETTINGS.SLP && vacScore >= SETTINGS.VAC));

                const isTriggeredNow = isFlash || isFuel;
                if (isTriggeredNow) {
                    stats[s].lastTrigger = Date.now();
                    if (!stats[s].logged) {
                        addLog(`${isFlash?'⚡':'🎯'} ${s}`, isFlash ? "text-yellow-400 font-black" : "text-purple-400 font-bold");
                        stats[s].logged = true;
                    }
                } else { stats[s].logged = false; }

                const timeSinceLast = Date.now() - stats[s].lastTrigger;
                const isPinned = pinned.has(s), isSearching = currentKeyword && s.includes(currentKeyword);
                if (isTriggeredNow || timeSinceLast < MEMORY || isPinned || isSearching) {
                    results.push({ s, fNow, pNow, slope, vacScore, flashRatio, isTriggered: isTriggeredNow, isFlash, linger: timeSinceLast < MEMORY && !isTriggeredNow, timeLeft: Math.ceil((MEMORY-timeSinceLast)/1000) });
                }
            });
            document.getElementById('load_status').innerText = "SYSTEM ACTIVE";
            render(results);
        } catch (e) { console.error(e); }
        isUpdating = false;
    }

    function render(results) {
        const list = document.getElementById('list'); list.innerHTML = '';
        results.sort((a,b) => (pinned.has(b.s) - pinned.has(a.s)) || (a.linger - b.linger) || (b.isTriggered - a.isTriggered));
        results.forEach(item => {
            const div = document.createElement('div');
            const isPinned = pinned.has(item.s);
            const borderClass = item.isFlash ? 'flash-trigger' : (item.isTriggered ? 'hunt-trigger' : '');
            div.className = `card p-4 rounded-xl ${borderClass} ${isPinned ? 'pinned' : ''} ${item.linger ? 'opacity-50' : ''}`;
            div.onclick = () => { isPinned ? pinned.delete(item.s) : pinned.add(item.s); };
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-white font-black text-lg">${isPinned?'📌':''} ${item.s.replace('USDT','')} ${item.linger ? `<span class="text-yellow-500 text-[10px] ml-2 italic">⏳ ${item.timeLeft}s</span>` : ''}</div>
                        <div class="text-[10px] text-zinc-500 font-bold">FR: ${(item.fNow*100).toFixed(4)}%</div>
                    </div>
                    <div class="text-right"><div class="text-blue-400 font-black">$${item.pNow.toFixed(item.pNow<1?6:2)}</div></div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-white/5 text-[9px] font-bold uppercase">
                    <div class="text-red-400">SLP: ${(item.slope*100).toFixed(1)}%</div>
                    <div class="${item.isFlash?'text-yellow-400 font-black':'text-zinc-500'}">FLS: ${(item.flashRatio*100).toFixed(1)}%</div>
                    <div class="text-blue-300">VAC: ${item.vacScore.toFixed(0)}</div>
                    <div class="text-zinc-500 text-right italic text-[8px]">${item.isTriggered ? '● ACTIVE' : '○ LINGER'}</div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    setInterval(update, 3000);
    document.getElementById('slp_range').oninput = function() { SETTINGS.SLP = this.value/1000; document.getElementById('slp_val').innerText = (this.value/10).toFixed(1)+'%'; };
    document.getElementById('volat_range').oninput = function() { SETTINGS.VOLAT_RATIO = this.value/100; document.getElementById('volat_val').innerText = this.value+'%'; };
    document.getElementById('vac_range').oninput = function() { SETTINGS.VAC = parseInt(this.value); document.getElementById('vac_val').innerText = this.value; };
</script>
</body>
</html>
