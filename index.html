<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V5.6.0 - MOMENTUM MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; cursor: pointer; transition: all 0.2s; }
        .hunt-trigger { border: 2px solid #a855f7 !important; background: #1e1b4b !important; animation: blink 1.2s infinite; }
        .pinned { border: 2px solid #3b82f6 !important; background: #081221 !important; }
        .funding-danger { border: 2px solid #ef4444 !important; box-shadow: inset 0 0 10px #ef4444; }
        @keyframes blink { 0%, 100% { opacity: 1; border-color: #a855f7; } 50% { opacity: 0.8; border-color: #3b0764; } }
        .toggle-active { background: #ef4444 !important; color: white !important; box-shadow: 0 0 15px #ef4444; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[11px]">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="bg-zinc-900 p-4 rounded-xl mb-4 border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col">
                    <h1 class="text-xl font-black text-blue-500 italic uppercase">⚡ Sniper V5.6.0</h1>
                    <div id="status" class="text-[9px] text-zinc-500 font-bold mt-1 uppercase tracking-widest">Momentum Analysis Mode</div>
                </div>
                <div class="flex gap-2">
                    <button id="slopeToggle" onclick="toggleFilter('USE_FUEL')" class="bg-black border border-zinc-700 px-3 py-2 rounded-lg font-black text-zinc-400 uppercase text-[10px] toggle-active">⚓ Fuel Filter: ON</button>
                    <input type="text" id="searchInput" placeholder="SEARCH COIN..." class="bg-black border border-zinc-800 px-3 py-1 rounded text-blue-400 outline-none w-32 uppercase">
                </div>
            </div>
            <div class="grid grid-cols-3 gap-6 font-black uppercase">
                <div class="space-y-1">
                    <div class="flex justify-between text-red-500"><span>📉 Slope Limit</span><span id="slp_val">-2.5%</span></div>
                    <input type="range" id="slp_range" min="-80" max="0" value="-25" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-yellow-500"><span>🔥 Volat Ratio (5m/24h)</span><span id="volat_val">5%</span></div>
                    <input type="range" id="volat_range" min="1" max="30" value="5" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-blue-400"><span>💎 Vacuum Score</span><span id="vac_val">80</span></div>
                    <input type="range" id="vac_range" min="10" max="150" value="80" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pr-2"></div>
    </div>
    <div class="w-72 bg-zinc-950 border-l border-zinc-900 flex flex-col p-4">
        <div class="text-zinc-600 font-black mb-4 border-b border-zinc-800 pb-2 uppercase text-[10px]">System Logs</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-2 font-mono text-[10px]"></div>
    </div>

<script>
    const P_USER = "Gkhqyhobnxzjfwgvaiyp347m1jkhn4", P_TOKEN = "acyoe3sz15x4n91r1349fdcau7x6pw";
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    const DEPTH = 100; // 5分鐘
    const MEMORY = 300000;
    
    let stats = {}, pinned = new Set();
    let SETTINGS = { SLP: -0.025, VOLAT_RATIO: 0.05, VAC: 80, USE_FUEL: true };
    let isUpdating = false;

    function toggleFilter(key) {
        SETTINGS[key] = !SETTINGS[key];
        const btn = document.getElementById('slopeToggle');
        btn.classList.toggle('toggle-active');
        btn.innerText = `⚓ Fuel Filter: ${SETTINGS[key]?'ON':'OFF'}`;
    }

    function addLog(msg, color="text-zinc-500") {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = `border-l-2 border-zinc-800 pl-2 py-1 ${color}`;
        div.innerHTML = `[${new Date().toLocaleTimeString('zh-TW',{hour12:false})}] ${msg}`;
        logs.prepend(div);
        if (logs.children.length > 50) logs.lastChild.remove();
    }

    async function update() {
        if (isUpdating) return;
        isUpdating = true;
        try {
            const [fRes, tRes] = await Promise.all([
                fetch('https://fapi.binance.com/fapi/v1/premiumIndex'),
                fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')
            ]);
            const fData = await fRes.json(), tData = await tRes.json();
            const tMap = new Map(tData.map(t => [t.symbol, t]));
            const keyword = document.getElementById('searchInput').value.toUpperCase();
            let results = [];

            fData.forEach(c => {
                const s = c.symbol;
                if (!s.endsWith('USDT') || EXCLUDE.includes(s)) return;
                const ticker = tMap.get(s);
                if (!ticker) return;

                const fNow = parseFloat(c.lastFundingRate), pNow = parseFloat(ticker.lastPrice), vNow = parseFloat(ticker.quoteVolume);
                const h24 = parseFloat(ticker.highPrice), l24 = parseFloat(ticker.lowPrice);
                const range24h = h24 - l24;
                const zonePrice = (h24 + l24) / 2;

                if (!stats[s]) stats[s] = { p: pNow, v: vNow, vHist:[], frHist:[], pHist:[], pvHist:[], lastTrigger:0, logged:false };

                const vDelta = Math.abs(vNow - stats[s].v), pDelta = Math.abs(pNow - stats[s].p);
                stats[s].vHist.push(vNow); stats[s].frHist.push(fNow); stats[s].pHist.push(pNow); stats[s].pvHist.push(pNow * vDelta);
                if (stats[s].vHist.length > DEPTH) { stats[s].vHist.shift(); stats[s].frHist.shift(); stats[s].pHist.shift(); stats[s].pvHist.shift(); }

                const isSearching = keyword && s.includes(keyword);
                const isPinned = pinned.has(s);
                const isWarmed = stats[s].frHist.length >= DEPTH;

                if (!isWarmed) {
                    if (isSearching || isPinned || Math.abs(fNow) >= 0.0005) results.push({ s, fNow, pNow, zonePrice, warming:true });
                    return;
                }

                // 計算新指標
                const slope = (fNow - stats[s].frHist[0]) / (Math.abs(stats[s].frHist[0]) || 0.0001);
                const range5m = Math.max(...stats[s].pHist) - Math.min(...stats[s].pHist);
                const volatProp = range5m / (range24h || 1); // 5M震幅佔24H比例
                const totalV = stats[s].vHist.reduce((a,b)=>a+b,0) - stats[s].vHist[0];
                const vwap5m = stats[s].pvHist.reduce((a,b)=>a+b,0) / (totalV || 1);
                const vacScore = (pDelta / (vDelta || 1)) * 1000000;

                // 三道閥門判定
                const gateA = volatProp >= SETTINGS.VOLAT_RATIO; 
                const gateB = pNow > vwap5m && pNow > zonePrice;
                const gateC = !SETTINGS.USE_FUEL || (slope <= SETTINGS.SLP && vacScore >= SETTINGS.VAC);

                const isTriggeredNow = gateA && gateB && gateC;
                if (isTriggeredNow) {
                    stats[s].lastTrigger = Date.now();
                    if (!stats[s].logged) {
                        addLog(`🎯 爆發確立: ${s} (震幅比:${(volatProp*100).toFixed(1)}%)`, "text-purple-400 font-bold");
                        stats[s].logged = true;
                        fetch('https://api.pushover.net/1/messages.json',{method:'POST',body:new URLSearchParams({token:P_TOKEN,user:P_USER,title:`🎯 SNIPER: ${s}`,message:`價格:$${pNow}\n震幅比:${(volatProp*100).toFixed(1)}%`,sound:'alien'})});
                    }
                } else { stats[s].logged = false; }

                if (isTriggeredNow || (Date.now()-stats[s].lastTrigger < MEMORY) || isPinned || isSearching || Math.abs(fNow)>=0.0005) {
                    results.push({ s, fNow, pNow, slope, vacScore, volatProp, vwap5m, zonePrice, isTriggered: (Date.now()-stats[s].lastTrigger < MEMORY), warming:false });
                }
                stats[s].p = pNow; stats[s].v = vNow;
            });
            render(results);
        } catch (e) { console.error(e); }
        isUpdating = false;
    }

    function render(results) {
        const list = document.getElementById('list'); list.innerHTML = '';
        results.sort((a,b) => (b.isTriggered - a.isTriggered) || (pinned.has(b.s) - pinned.has(a.s)) || (Math.abs(b.fNow) - Math.abs(a.fNow)));
        results.slice(0, 24).forEach(item => {
            const isDanger = Math.abs(item.fNow) >= 0.0005;
            const div = document.createElement('div');
            div.className = `card p-4 rounded-xl ${item.isTriggered ? 'hunt-trigger' : (pinned.has(item.s) ? 'pinned' : '')} ${isDanger ? 'funding-danger' : ''}`;
            div.onclick = () => { pinned.has(item.s) ? pinned.delete(item.s) : pinned.add(item.s); };
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-white font-black text-lg">${pinned.has(item.s)?'📌':''} ${item.s.replace('USDT','')}</div>
                        <div class="text-[10px] ${isDanger?'text-red-500':'text-zinc-500'}">FR: ${(item.fNow*100).toFixed(4)}%</div>
                    </div>
                    <div class="text-right">
                        <div class="text-blue-400 font-bold">$${item.pNow.toFixed(item.pNow<1?6:2)}</div>
                        <div class="text-[9px] text-zinc-600">Avg: $${item.zonePrice.toFixed(2)}</div>
                    </div>
                </div>
                ${!item.warming ? `
                <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-white/5 text-[9px]">
                    <div class="text-red-400">SLOPE: ${(item.slope*100).toFixed(1)}%</div>
                    <div class="text-yellow-400">VOLAT: ${(item.volatProp*100).toFixed(1)}%</div>
                    <div class="text-blue-300">VACUUM: ${item.vacScore.toFixed(0)}</div>
                    <div class="${item.pNow > item.vwap5m ? 'text-green-400':'text-zinc-500'}">VWAP: ${item.pNow > item.vwap5m ? 'ABOVE' : 'BELOW'}</div>
                </div>` : '<div class="mt-2 text-zinc-700 italic text-center">DATA WARMING...</div>'}
            `;
            list.appendChild(div);
        });
    }

    setInterval(update, 3000);
    document.getElementById('slp_range').oninput = function() { SETTINGS.SLP = this.value/1000; document.getElementById('slp_val').innerText = (this.value/10).toFixed(1)+'%'; };
    document.getElementById('volat_range').oninput = function() { SETTINGS.VOLAT_RATIO = this.value/100; document.getElementById('volat_val').innerText = this.value+'%'; };
    document.getElementById('vac_range').oninput = function() { SETTINGS.VAC = parseInt(this.value); document.getElementById('vac_val').innerText = this.value; };
</script>
</body>
</html>
