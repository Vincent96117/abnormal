<!DOCTYPE html>
<html>
<head>
    <title>⚡ DRIVE SNIPER V5.2.6 - 價格透明版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; cursor: pointer; transition: all 0.2s; }
        .hunt-trigger { border: 2px solid #a855f7 !important; background: #1e1b4b !important; animation: blink 0.8s infinite; }
        .pinned { border: 2px solid #3b82f6 !important; background: #081221 !important; }
        .funding-danger { border: 2px solid #ef4444 !important; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .score-val { font-weight: 900; color: #eab308; line-height: 1; }
        .toggle-btn { transition: all 0.3s; border: 1px solid #333; }
        .toggle-active { background: #ef4444 !important; color: white !important; box-shadow: 0 0 15px #ef4444; border-color: #fff; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="bg-zinc-900 p-4 rounded-xl mb-4 border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col">
                    <h1 class="text-xl font-black text-blue-500 italic uppercase">⚡ Sniper V5.2.6</h1>
                    <div id="status" class="text-[9px] text-zinc-500 font-bold uppercase mt-1">Ready</div>
                </div>
                <div class="flex gap-4 items-center">
                    <button id="breakoutToggle" onclick="toggleBreakout()" class="toggle-btn bg-black text-[10px] px-4 py-2 rounded-lg font-black uppercase text-zinc-400">
                        ⚡ Breakout Only (站上密集區)
                    </button>
                    <input type="text" id="searchInput" placeholder="搜尋幣名..." class="bg-black border border-zinc-800 px-3 py-1 rounded text-sm text-blue-400 outline-none w-40">
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4 text-[10px] uppercase font-bold">
                <div class="space-y-1">
                    <div class="flex justify-between text-red-500"><span>📉 Slope</span><span id="slp_val">-5%</span></div>
                    <input type="range" id="slp_range" min="-80" max="0" value="-5" class="w-full">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-yellow-500"><span>💯 Vacuum</span><span id="drv_val">90</span></div>
                    <input type="range" id="drv_range" min="0" max="100" value="90" class="w-full">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-blue-400"><span>⚡ Vol Boost</span><span id="vol_val">1.2x</span></div>
                    <input type="range" id="vol_range" min="10" max="50" value="12" class="w-full">
                </div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pr-2"></div>
    </div>
    <div class="w-80 bg-zinc-950 border-l border-zinc-800 flex flex-col p-4">
        <div class="font-black text-xs text-zinc-500 uppercase mb-4 border-b border-zinc-800 pb-2">Real-time Logs</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-2 text-[10px] font-mono"></div>
    </div>

<script>
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    let stats = {}, pinned = new Set(), FILTER = { SLP: -0.05, DRV_SCORE: 90, VOL_RATIO: 1.2 };
    let IS_BREAKOUT_ONLY = false, isUpdating = false;

    function toggleBreakout() {
        IS_BREAKOUT_ONLY = !IS_BREAKOUT_ONLY;
        document.getElementById('breakoutToggle').classList.toggle('toggle-active');
    }

    function addLog(msg, color="text-zinc-500") {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = `border-l-2 border-zinc-800 pl-2 py-1 ${color}`;
        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logs.prepend(div);
        if (logs.children.length > 50) logs.lastChild.remove();
    }

    function calculateScore(d) {
        if (d < 1000) return Math.round((d / 1000) * 20);
        if (d < 5000) return Math.round(20 + ((d - 1000) / 4000) * 40);
        if (d < 15000) return Math.round(60 + ((d - 5000) / 10000) * 30);
        return Math.round(90 + Math.min(10, (d - 15000) / 5000));
    }

    async function update() {
        if (isUpdating) return;
        isUpdating = true;

        try {
            // 階段 1：抓資費 (輕量級)
            const fRes = await fetch('https://fapi.binance.com/fapi/v1/premiumIndex');
            const fData = await fRes.json();
            
            const keyword = document.getElementById('searchInput').value.toUpperCase();
            
            // 篩選出需要個別抓取數據的標的 (資費高、已釘選、或正在搜尋)
            const candidates = fData.filter(c => {
                const s = c.symbol;
                if (!s.endsWith('USDT') || EXCLUDE.includes(s)) return false;
                return Math.abs(parseFloat(c.lastFundingRate)) >= 0.0005 || pinned.has(s) || (keyword && s.includes(keyword));
            });

            const displayResults = [];

            // 階段 2：精確打擊 (個別抓取詳細數據)
            for (let i = 0; i < Math.min(candidates.length, 30); i++) {
                const c = candidates[i];
                const s = c.symbol;

                try {
                    const tRes = await fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${s}`);
                    const ticker = await tRes.json();

                    const fNow = parseFloat(c.lastFundingRate);
                    const pNow = parseFloat(ticker.lastPrice);
                    const vNow = parseFloat(ticker.quoteVolume);
                    const pHigh = parseFloat(ticker.highPrice);
                    const pLow = parseFloat(ticker.lowPrice);
                    const zonePrice = (pHigh + pLow) / 2; // 平均成交密集區價格

                    if (!stats[s]) {
                        stats[s] = { p: pNow, v: vNow, vHist: [], frHist: [], drvHist: [] };
                        continue;
                    }

                    stats[s].vHist.push(vNow); if (stats[s].vHist.length > 12) stats[s].vHist.shift();
                    stats[s].frHist.push(fNow); if (stats[s].frHist.length > 12) stats[s].frHist.shift();

                    if (stats[s].frHist.length < 12) continue;

                    const avgVol = stats[s].vHist.reduce((a,b)=>a+b,0) / stats[s].vHist.length;
                    const volRatio = vNow / (avgVol || 1);
                    const slope = (fNow - stats[s].frHist[0]) / Math.abs(stats[s].frHist[0] || 0.0001);

                    const vDelta = Math.abs(vNow - stats[s].v);
                    const pDelta = Math.abs(pNow - stats[s].p) / stats[s].p;
                    const instDrv = vDelta > 0 ? (pDelta / vDelta) * 100000000 : 0;
                    stats[s].drvHist.push(instDrv); if (stats[s].drvHist.length > 12) stats[s].drvHist.shift();
                    const avgDrv = stats[s].drvHist.reduce((a,b)=>a+b,0) / stats[s].drvHist.length;

                    const filterScore = calculateScore(avgDrv);
                    const isTriggered = (slope <= FILTER.SLP && filterScore >= FILTER.DRV_SCORE && volRatio >= FILTER.VOL_RATIO);
                    const isFundingDanger = Math.abs(fNow) >= 0.0005 && filterScore > 40;
                    const isBreakingOut = pNow > zonePrice;

                    let shouldShow = isTriggered || pinned.has(s) || (keyword && s.includes(keyword)) || isFundingDanger;
                    if (IS_BREAKOUT_ONLY && !isBreakingOut && !pinned.has(s)) shouldShow = false;

                    if (shouldShow) {
                        displayResults.push({
                            s, slope, fNow, volRatio, filterScore,
                            rawValueStr: Math.round(avgDrv).toLocaleString(),
                            livePrice: pNow,
                            zonePrice: zonePrice,
                            isTriggered, isFundingDanger, isBreakingOut
                        });
                    }

                    if (isTriggered && !stats[s].logged) {
                        addLog(`🔥 爆發點: ${s.replace('USDT','')} | FR: ${(fNow*100).toFixed(3)}%`, "text-purple-400 font-bold");
                        stats[s].logged = true;
                    } else if (!isTriggered) { stats[s].logged = false; }

                    stats[s].p = pNow; stats[s].v = vNow;
                } catch (e) { console.error(`Err: ${s}`); }
                
                await new Promise(r => setTimeout(r, 50)); // 防封鎖延遲
            }

            document.getElementById('status').innerText = `Scanned ${candidates.length} | Showing ${displayResults.length}`;
            render(displayResults);

        } catch (e) { addLog("⚠️ Connection Error", "text-red-500"); }
        isUpdating = false;
    }

    function render(results) {
        const list = document.getElementById('list');
        list.innerHTML = '';
        results.sort((a,b) => {
            const rankA = (a.isTriggered ? 3 : (pinned.has(a.s) ? 2 : (a.isFundingDanger ? 1 : 0)));
            const rankB = (b.isTriggered ? 3 : (pinned.has(b.s) ? 2 : (b.isFundingDanger ? 1 : 0)));
            if (rankA !== rankB) return rankB - rankA;
            return Math.abs(b.fNow) - Math.abs(a.fNow);
        });

        results.slice(0, 24).forEach(item => {
            const div = document.createElement('div');
            div.className = `card p-4 rounded-xl ${item.isTriggered ? 'hunt-trigger' : (pinned.has(item.s) ? 'pinned' : '')} ${item.isFundingDanger ? 'funding-danger' : ''}`;
            div.onclick = () => { pinned.has(item.s) ? pinned.delete(item.s) : pinned.add(item.s); };
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <div class="text-white font-black text-xl flex items-center gap-2">
                            ${pinned.has(item.s) ? '📌' : ''} ${item.s.replace('USDT','')}
                            <span class="text-[10px] px-1 bg-zinc-800 rounded text-zinc-400">LIVE</span>
                        </div>
                        <div class="text-[10px] ${item.slope < 0 ? 'text-red-500' : 'text-zinc-500'} font-bold">SLP: ${(item.slope*100).toFixed(1)}% | FR: ${(item.fNow*100).toFixed(3)}%</div>
                        <div class="mt-2 space-y-0.5">
                            <div class="text-[11px] text-blue-400 font-black">PRICE: ${item.livePrice.toFixed(4)}</div>
                            <div class="text-[10px] text-zinc-500 font-bold uppercase">Zone: ${item.zonePrice.toFixed(4)} ${item.isBreakingOut ? '<span class="text-green-500 font-black">▲ Breakout</span>' : '<span class="text-red-500">▼ Below</span>'}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-yellow-500 font-black text-[10px]">SCORE: ${item.filterScore}</div>
                        <div class="score-val text-xl">${item.rawValueStr}</div>
                        <div class="text-[8px] text-zinc-600 font-black uppercase tracking-widest">Vacuum</div>
                    </div>
                </div>
                <div class="mt-3 flex items-center space-x-2">
                    <div class="flex-1 bg-zinc-900 h-1.5 rounded-full overflow-hidden">
                        <div class="h-full ${item.isTriggered ? 'bg-purple-500' : 'bg-blue-500'}" style="width: ${Math.min(100, item.volRatio * 20)}%"></div>
                    </div>
                    <span class="text-blue-400 font-black text-xs">${item.volRatio.toFixed(1)}x</span>
                </div>`;
            list.appendChild(div);
        });
    }

    const bindFilter = (id, valId, key, scale) => {
        document.getElementById(id).oninput = (e) => {
            let v = parseFloat(e.target.value);
            FILTER[key] = v / scale;
            document.getElementById(valId).innerText = (key==='VOL_RATIO'?(v/10).toFixed(1)+'x':v+(key==='DRV_SCORE'?'':'%'));
        };
    };
    bindFilter('slp_range', 'slp_val', 'SLP', 100);
    bindFilter('drv_range', 'drv_val', 'DRV_SCORE', 1);
    bindFilter('vol_range', 'vol_val', 'VOL_RATIO', 10);

    setInterval(update, 5000); 
    update();
</script>
</body>
</html>
