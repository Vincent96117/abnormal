<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V5.7.9 - ELITE WAP EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; cursor: pointer; transition: all 0.3s; position: relative; }
        .hunt-trigger { border: 2px solid #a855f7 !important; background: #1e1b4b !important; animation: pulse-purple 1.5s infinite; z-index: 10; }
        .flash-trigger { border: 2px solid #facc15 !important; background: #422006 !important; animation: pulse-yellow 0.8s infinite; z-index: 20; }
        .pinned { border: 2px solid #3b82f6 !important; background: #081221 !important; }
        @keyframes pulse-purple { 0%, 100% { box-shadow: 0 0 10px #a855f7; } 50% { box-shadow: 0 0 20px #a855f7; } }
        @keyframes pulse-yellow { 0%, 100% { box-shadow: 0 0 15px #facc15; } 50% { box-shadow: 0 0 30px #facc15; } }
        .toggle-active { background: #ef4444 !important; color: white !important; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[11px]">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="bg-zinc-900 p-4 rounded-xl mb-4 border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col">
                    <h1 class="text-xl font-black text-blue-500 italic uppercase">⚡ Sniper V5.7.9 <span id="heartbeat" class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span></h1>
                    <div class="text-[9px] text-zinc-500 font-bold mt-1 uppercase tracking-widest">Logic: <span class="text-yellow-400">Flash > WAP</span> | <span class="text-purple-400">Fuel ±3% WAP</span></div>
                </div>
                <div class="flex items-center gap-3">
                    <div id="search_light" class="w-3 h-3 rounded-full bg-zinc-800 transition-all duration-300"></div>
                    <button id="slopeToggle" onclick="toggleFilter('USE_FUEL')" class="bg-black border border-zinc-700 px-3 py-2 rounded-lg font-black text-zinc-400 text-[10px] toggle-active uppercase">⚓ Fuel Mode</button>
                    <input type="text" id="searchInput" onkeydown="handleSearch(event)" placeholder="SYMBOL & ENTER" class="bg-black border-2 border-zinc-800 px-3 py-1 rounded text-blue-400 outline-none w-40 uppercase font-black transition-all">
                </div>
            </div>
            
            <div class="grid grid-cols-4 gap-4 font-black uppercase">
                <div class="space-y-1"><div class="flex justify-between text-red-500"><span>📉 Slope</span><span id="slp_val">-2.5%</span></div><input type="range" id="slp_range" min="-800" max="0" value="-25" class="w-full h-1 bg-zinc-800 appearance-none cursor-pointer"></div>
                <div class="space-y-1"><div class="flex justify-between text-yellow-400"><span>⚡ Flash Threshold</span><span id="flash_val">15%</span></div><input type="range" id="flash_range" min="1" max="60" value="15" class="w-full h-1 bg-zinc-800 appearance-none cursor-pointer"></div>
                <div class="space-y-1"><div class="flex justify-between text-purple-400"><span>🎯 Fuel Threshold</span><span id="fuel_val">10%</span></div><input type="range" id="fuel_range" min="1" max="60" value="10" class="w-full h-1 bg-zinc-800 appearance-none cursor-pointer"></div>
                <div class="space-y-1"><div class="flex justify-between text-blue-400"><span>💎 Vac Limit</span><span id="vac_val">80</span></div><input type="range" id="vac_range" min="10" max="500" value="80" class="w-full h-1 bg-zinc-800 appearance-none cursor-pointer"></div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pr-2"></div>
    </div>
    <div class="w-72 bg-zinc-950 border-l border-zinc-900 flex flex-col p-4 text-[10px]">
        <div class="text-zinc-600 font-black mb-4 border-b border-zinc-800 pb-2 uppercase text-center italic">Combat Log & Push</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-2"></div>
        <button onclick="testPush()" class="mt-4 bg-zinc-800 text-zinc-500 py-2 rounded font-bold hover:text-white transition-all text-[9px]">TEST PUSH TO PHONE</button>
    </div>

<script>
    const P_USER = "Gkhqyhobnxzjfwgvaiyp347m1jkhn4", P_TOKEN = "acyoe3sz15x4n91r1349fdcau7x6pw";
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    const DEPTH = 1200, MEMORY = 300000; // 5分鐘記憶
    let stats = {}, pinned = new Set(), currentKeyword = "";
    let SETTINGS = { SLP: -0.025, FLASH_RATIO: 0.15, FUEL_RATIO: 0.1, VAC: 80, USE_FUEL: true };
    let isUpdating = false;

    async function sendPushover(title, message) {
        try {
            await fetch('https://api.pushover.net/1/messages.json', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ token: P_TOKEN, user: P_USER, title, message })
            });
        } catch (e) { console.error("Push Error", e); }
    }

    function testPush() { sendPushover("SNIPER TEST", "手機通訊正常，等待信號中..."); addLog("Sent Test Push to Phone", "text-blue-400"); }

    function handleSearch(e) {
        if (e.key === 'Enter') {
            currentKeyword = e.target.value.toUpperCase();
            document.getElementById('search_light').className = currentKeyword ? "w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e] animate-pulse" : "w-3 h-3 rounded-full bg-zinc-800";
            addLog(currentKeyword ? `SEARCH: ${currentKeyword}` : "FILTER RESET", "text-blue-400");
        }
    }

    function toggleFilter(key) { SETTINGS[key] = !SETTINGS[key]; document.getElementById('slopeToggle').classList.toggle('toggle-active'); }

    function addLog(msg, color="text-zinc-500") {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = `border-l-2 border-zinc-800 pl-2 py-1 ${color}`;
        div.innerHTML = `[${new Date().toLocaleTimeString('zh-TW',{hour12:false})}] ${msg}`;
        logs.prepend(div);
        if (logs.children.length > 50) logs.lastChild.remove();
    }

    async function update() {
        if (isUpdating) return; isUpdating = true;
        document.getElementById('heartbeat').classList.toggle('opacity-0');
        try {
            const [fRes, tRes] = await Promise.all([
                fetch('https://fapi.binance.com/fapi/v1/premiumIndex'),
                fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')
            ]);
            const fData = await fRes.json(), tData = await tRes.json();
            const tMap = new Map(tData.map(t => [t.symbol, t]));

            let results = [];
            fData.forEach(c => {
                const s = c.symbol;
                if (!s.endsWith('USDT')) return;
                const ticker = tMap.get(s); if (!ticker) return;

                const pNow = parseFloat(ticker.lastPrice), fNow = parseFloat(c.lastFundingRate);
                const vNow = parseFloat(ticker.quoteVolume), wap24h = parseFloat(ticker.weightedAvgPrice);
                const h24 = parseFloat(ticker.highPrice), l24 = parseFloat(ticker.lowPrice);

                if (!stats[s]) stats[s] = { lastV: vNow, vDeltas:[], frHist:[], pHist:[], pvDeltas:[], lastTrigger:0, logged:false, lastFR: fNow, lastPush: 0 };

                // 排除名單過濾 (除非搜尋)
                if (EXCLUDE.includes(s) && !s.includes(currentKeyword)) return;

                // 資費異常監控 (+-0.05)
                if (Math.abs(fNow - stats[s].lastFR) >= 0.0005) {
                    const msg = `FR: ${s} (${(fNow*100).toFixed(3)}%)`;
                    addLog(msg, "text-orange-400 font-bold");
                    sendPushover("⚠️ 資費異動", msg);
                    stats[s].lastFR = fNow;
                }

                const vDelta = Math.max(0, vNow - stats[s].lastV);
                stats[s].lastV = vNow;
                stats[s].vDeltas.push(vDelta);
                stats[s].pvDeltas.push(pNow * vDelta);
                stats[s].frHist.push(fNow);
                stats[s].pHist.push(pNow);
                if (stats[s].frHist.length > DEPTH) {
                    stats[s].vDeltas.shift(); stats[s].pvDeltas.shift(); stats[s].frHist.shift(); stats[s].pHist.shift();
                }

                if (stats[s].frHist.length < 50) return;

                const v5mSum = Math.max(0.0001, stats[s].vDeltas.slice(-100).reduce((a,b)=>a+b,0));
                const vwap5m = stats[s].pvDeltas.slice(-100).reduce((a,b)=>a+b,0) / v5mSum;
                const pBack = stats[s].pHist.slice(-200);
                const bgVolat = (Math.max(...pBack) - Math.min(...pBack)) / pNow;
                
                const slope = (fNow - stats[s].frHist[stats[s].frHist.length-100]) / (Math.abs(stats[s].frHist[stats[s].frHist.length-100]) || 0.0001);
                const vacScore = ((Math.max(...stats[s].pHist.slice(-100)) - Math.min(...stats[s].pHist.slice(-100))) / v5mSum) * 100000000;
                const flashRatio = (pNow - stats[s].pHist[stats[s].pHist.length-20]) / (h24 - l24 || 1);

                const distToWap = (pNow - wap24h) / wap24h;
                
                // 黃卡: 突破 WAP 
                const isFlash = (flashRatio >= SETTINGS.FLASH_RATIO) && (flashRatio > bgVolat * 1.8) && (pNow > wap24h) && (pNow > vwap5m);
                // 紫卡: WAP ±3% 蓄力
                const isFuel = SETTINGS.USE_FUEL && (slope <= SETTINGS.SLP) && (vacScore >= SETTINGS.VAC) && (Math.abs(distToWap) <= 0.03) && (pNow > vwap5m);

                const power = (flashRatio * 500) + (vacScore / 10) - (slope * 100);

                if (isFlash || isFuel) {
                    stats[s].lastTrigger = Date.now();
                    if (!stats[s].logged) {
                        addLog(`${isFlash?'⚡FLASH':'🎯FUEL'} ${s} WAP:${(distToWap*100).toFixed(1)}%`, isFlash?"text-yellow-400 font-black":"text-purple-400");
                        if (isFlash && (Date.now() - stats[s].lastPush > MEMORY)) {
                            sendPushover(`⚡ 黃卡閃電: ${s}`, `現價:${pNow} (已破WAP)\n爆發力:${(flashRatio*100).toFixed(1)}%\n真空度:${vacScore.toFixed(0)}`);
                            stats[s].lastPush = Date.now();
                        }
                        stats[s].logged = true;
                    }
                } else { stats[s].logged = false; }

                const timeSinceLast = Date.now() - stats[s].lastTrigger;
                const isPinned = pinned.has(s), isSearching = currentKeyword && s.includes(currentKeyword);
                
                if (isFlash || isFuel || timeSinceLast < 600000 || isPinned || isSearching) {
                    results.push({ s, fNow, pNow, slope, vacScore, flashRatio, power, isFlash, wap24h, vwap5m, distToWap, isTriggered: (isFlash||isFuel), linger: timeSinceLast >= 30000 && !(isFlash||isFuel) });
                }
            });

            // 修正排序：黃卡強行置頂左側
            results.sort((a,b) => (pinned.has(b.s) - pinned.has(a.s)) || (b.isFlash - a.isFlash) || (b.isTriggered - a.isTriggered) || (b.power - a.power));
            render(results);
        } catch (e) { console.error(e); }
        isUpdating = false;
    }

    function render(results) {
        const list = document.getElementById('list'); list.innerHTML = '';
        results.forEach((item, idx) => {
            const isPinned = pinned.has(item.s);
            const div = document.createElement('div');
            div.className = `card p-4 rounded-xl ${item.isFlash ? 'flash-trigger' : (item.isTriggered ? 'hunt-trigger' : '')} ${isPinned?'pinned':''} ${item.linger?'opacity-40':''}`;
            div.onclick = () => { isPinned ? pinned.delete(item.s) : pinned.add(item.s); };
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-white font-black text-lg">${item.s.replace('USDT','')}</div>
                        <div class="text-[9px] text-zinc-500 font-bold">WAP: ${item.wap24h.toFixed(item.wap24h<1?5:2)} (<span class="${item.distToWap>=0?'text-green-500':'text-red-500'}">${(item.distToWap*100).toFixed(1)}%</span>)</div>
                    </div>
                    <div class="text-right">
                        <div class="text-blue-400 font-black text-sm">$${item.pNow.toFixed(item.pNow<1?5:2)}</div>
                        <div class="text-[8px] text-zinc-600 font-bold uppercase">Rank: ${idx+1}</div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-white/5 text-[9px] font-bold uppercase">
                    <div class="text-red-400">SLP: ${(item.slope*100).toFixed(1)}%</div>
                    <div class="${item.isFlash?'text-yellow-400':'text-zinc-500'}">FLS: ${(item.flashRatio*100).toFixed(1)}%</div>
                    <div class="text-blue-300">VAC: ${item.vacScore.toFixed(0)}</div>
                    <div class="text-zinc-500 text-right text-[8px]">${item.isFlash?'⚡BREAK':'🎯STABLE'}</div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    setInterval(update, 3000);
    document.getElementById('slp_range').oninput = function() { SETTINGS.SLP = this.value/1000; document.getElementById('slp_val').innerText = (this.value/10).toFixed(1)+'%'; };
    document.getElementById('flash_range').oninput = function() { SETTINGS.FLASH_RATIO = this.value/100; document.getElementById('flash_val').innerText = this.value+'%'; };
    document.getElementById('fuel_range').oninput = function() { SETTINGS.FUEL_RATIO = this.value/100; document.getElementById('fuel_val').innerText = this.value+'%'; };
    document.getElementById('vac_range').oninput = function() { SETTINGS.VAC = parseInt(this.value); document.getElementById('vac_val').innerText = this.value; };
</script>
</body>
</html>
