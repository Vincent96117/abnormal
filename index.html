<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V7.0 - ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');
        body { background: #050505; color: #0f0; font-family: 'JetBrains Mono', monospace; overflow: hidden; }
        .card { background: #0a0a0a; border: 1px solid #1a1a1a; position: relative; transition: 0.2s; cursor: pointer; }
        .hunt-trigger { border: 2px solid #a855f7 !important; background: #1e1b4b !important; animation: blink 1.2s infinite; }
        .poc-break { border-left: 4px solid #22c55e !important; }
        .ma-squeeze { border-right: 4px solid #eab308 !important; }
        .pinned { border: 2px solid #3b82f6 !important; background: #081221 !important; }
        @keyframes blink { 0%, 100% { border-color: #a855f7; } 50% { border-color: #3b0764; } }
        .tag { font-size: 8px; padding: 1px 3px; font-weight: 900; border-radius: 2px; text-transform: uppercase; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #222; }
    </style>
</head>
<body class="flex h-screen text-[10px]">
    <div class="flex-1 flex flex-col p-3 overflow-hidden">
        <div class="bg-zinc-900/50 p-4 rounded-xl mb-3 border border-white/5">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-black text-blue-500 italic">⚡ SNIPER V7.0 <span class="text-[10px] text-zinc-600 not-italic">ULTIMATE</span></h1>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="SEARCH..." class="bg-black border border-zinc-800 px-3 py-1 rounded text-blue-400 outline-none w-28 uppercase">
                    <button onclick="toggleSystem()" id="sysBtn" class="bg-blue-600 text-white px-4 py-1 rounded font-black uppercase shadow-[0_0_15px_rgba(37,99,235,0.5)]">Start Radar</button>
                </div>
            </div>
            <div class="grid grid-cols-4 gap-4 uppercase font-bold">
                <div class="space-y-1">
                    <div class="flex justify-between text-red-500"><span>📉 Slope</span><span id="v_slp">-8%</span></div>
                    <input type="range" id="i_slp" min="-100" max="0" value="-8" class="w-full h-1 bg-zinc-800 appearance-none rounded cursor-pointer">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-yellow-500"><span>💯 Vacuum</span><span id="v_drv">85</span></div>
                    <input type="range" id="i_drv" min="0" max="100" value="85" class="w-full h-1 bg-zinc-800 appearance-none rounded cursor-pointer">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-green-500"><span>🎯 POC Gap</span><span id="v_poc">0.3%</span></div>
                    <input type="range" id="i_poc" min="0" max="50" value="3" class="w-full h-1 bg-zinc-800 appearance-none rounded cursor-pointer">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-orange-400"><span>🌀 MA SQZ</span><span id="v_sqz">1.5%</span></div>
                    <input type="range" id="i_sqz" min="0" max="50" value="15" class="w-full h-1 bg-zinc-800 appearance-none rounded cursor-pointer">
                </div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 overflow-y-auto pr-1"></div>
    </div>

    <div class="w-72 bg-black border-l border-zinc-900 p-3 flex flex-col">
        <div class="text-zinc-600 font-black mb-2 border-b border-zinc-800 pb-1">SYSTEM LOGS</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-1 font-mono text-[9px]"></div>
    </div>

<script>
    const P_USER = "Gkhqyhobnxzjfwgvaiyp347m1jkhn4";
    const P_TOKEN = "acyoe3sz15x4n91r1349fdcau7x6pw";
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    
    let stats = {}, pinned = new Set(), isRunning = false, symbols = [];
    let FILTER = { SLP: -0.08, DRV: 85, POC: 0.003, SQZ: 0.015 };

    function addLog(msg, color="text-zinc-500") {
        const div = document.createElement('div');
        div.className = `border-l border-zinc-800 pl-2 ${color}`;
        div.innerHTML = `[${new Date().toLocaleTimeString('zh-TW', {hour12:false})}] ${msg}`;
        document.getElementById('logs').prepend(div);
    }

    function sendPush(symbol, slope, drv, price, type = "START") {
        const title = type === "START" ? `🎯 SNIPER: ${symbol} 紫框發動` : `⚠️ SNIPER: ${symbol} 訊號解除`;
        const sound = type === "START" ? "alien" : "falling";
        const message = type === "START" ? 
            `🚀 波段狙擊確立！\n現價: ${price}\n5M斜率: ${(slope*100).toFixed(1)}%\n真空分數: ${Math.round(drv)}` :
            `🛑 紫框已熄滅！\n結束現價: ${price}\n請檢查獲利。`;

        fetch('https://api.pushover.net/1/messages.json', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ token: P_TOKEN, user: P_USER, title, message, priority: 1, sound })
        });
    }

    function calcMA(data, period) {
        if (data.length < period) return 0;
        return data.slice(-period).reduce((a, b) => a + b, 0) / period;
    }

    function calcPOC(klines) {
        let minP = Math.min(...klines.map(k => parseFloat(k[3])));
        let maxP = Math.max(...klines.map(k => parseFloat(k[2])));
        let bins = new Array(20).fill(0);
        klines.forEach(k => {
            let p = (parseFloat(k[2]) + parseFloat(k[3])) / 2;
            let v = parseFloat(k[5]);
            let idx = Math.floor(((p - minP) / (maxP - minP || 1)) * 19);
            bins[idx] += v;
        });
        return minP + (bins.indexOf(Math.max(...bins)) * ((maxP - minP) / 20));
    }

    async function fetchData(s) {
        try {
            const [kRes, fRes] = await Promise.all([
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${s}&interval=5m&limit=100`),
                fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${s}`)
            ]);
            const k = await kRes.json(), f = await fRes.json();
            const prices = k.map(x => parseFloat(x[4]));
            const lastP = prices[prices.length-1];
            const vNow = parseFloat(k[k.length-1][5]);
            const vAvg = k.slice(-20).reduce((a,b)=>a+parseFloat(b[5]),0)/20;

            const pDelta = Math.abs(lastP - prices[prices.length-2]) / prices[prices.length-2];
            const vDelta = Math.abs(vNow - (stats[s]?.lastV || vNow));
            const drvRaw = vDelta > 0 ? (pDelta / vDelta) * 100000000 : 0;

            const ma7 = calcMA(prices, 7), ma25 = calcMA(prices, 25), ma99 = calcMA(prices, 99);
            const maSqz = (Math.max(ma7, ma25, ma99) - Math.min(ma7, ma25, ma99)) / Math.min(ma7, ma25, ma99);
            const poc = calcPOC(k.slice(-50));

            if(!stats[s]) stats[s] = { frHist: [], pushLogged: false };
            stats[s].frHist.push(parseFloat(f.lastFundingRate));
            if(stats[s].frHist.length > 20) stats[s].frHist.shift();
            const slope = (stats[s].frHist[stats[s].frHist.length-1] - stats[s].frHist[0]) / (Math.abs(stats[s].frHist[0]) || 0.0001);

            const isPocBrk = lastP > poc * (1 + FILTER.POC) && vNow > vAvg * 1.2;
            const isSqz = maSqz < FILTER.SQZ;
            const isTriggered = slope < FILTER.SLP && drvRaw > 15000 && isPocBrk;

            // 推播邏輯
            if (isTriggered && !stats[s].pushLogged) {
                sendPush(s.replace('USDT',''), slope, drvRaw, lastP, "START");
                stats[s].pushLogged = true;
                addLog(`🎯 推播: ${s} 紫框發動`, "text-purple-400 font-bold");
            } else if (!isTriggered && stats[s].pushLogged) {
                sendPush(s.replace('USDT',''), 0, 0, lastP, "END");
                stats[s].pushLogged = false;
                addLog(`🛑 推播: ${s} 訊號解除`, "text-zinc-500");
            }

            stats[s].lastV = vNow;
            return { s, price: lastP, poc, slope, drv: drvRaw, maSqz, volR: vNow/vAvg, isPocBrk, isSqz, isTriggered };
        } catch(e) { return null; }
    }

    async function scan() {
        if(!isRunning) return;
        const batch = symbols.slice(0, 15);
        symbols = [...symbols.slice(15), ...batch];
        for(let s of batch) {
            const data = await fetchData(s);
            if(data) stats[s] = { ...stats[s], ...data };
        }
        render();
        setTimeout(scan, 1200);
    }

    function render() {
        const list = document.getElementById('list');
        const search = document.getElementById('searchInput').value.toUpperCase();
        const results = Object.values(stats).filter(x => x.s && x.s.includes(search));
        
        list.innerHTML = results
            .sort((a,b) => (pinned.has(b.s)-pinned.has(a.s)) || (b.isTriggered ? 1 : -1))
            .slice(0, 24)
            .map(x => `
                <div class="card p-3 rounded-lg ${x.isTriggered ? 'hunt-trigger' : ''} ${x.isPocBrk ? 'poc-break' : ''} ${x.isSqz ? 'ma-squeeze' : ''} ${pinned.has(x.s) ? 'pinned' : ''}" onclick="togglePin('${x.s}')">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-white font-black text-sm">${pinned.has(x.s)?'📌 ':''}${x.s.replace('USDT','')}</div>
                            <div class="text-[8px] ${x.slope < FILTER.SLP ? 'text-red-500' : 'text-zinc-500'}">SLP: ${(x.slope*100).toFixed(1)}%</div>
                        </div>
                        <div class="text-right">
                            <div class="text-yellow-500 font-black text-[9px]">DRV: ${Math.round(x.drv/1000)}K</div>
                            <div class="text-white font-bold">$${x.price < 1 ? x.price.toFixed(5) : x.price.toFixed(3)}</div>
                        </div>
                    </div>
                    <div class="mt-2 grid grid-cols-2 gap-1 text-[8px] font-bold">
                        <div class="bg-zinc-900 p-1 rounded">POC: ${x.poc.toFixed(4)}</div>
                        <div class="bg-zinc-900 p-1 rounded">SQZ: ${(x.maSqz*100).toFixed(1)}%</div>
                    </div>
                    <div class="mt-2 flex gap-1">
                        ${x.isTriggered ? '<span class="tag bg-purple-600 text-white">HUNTER</span>' : ''}
                        ${x.isPocBrk ? '<span class="tag bg-green-600 text-black">POC_BRK</span>' : ''}
                        ${x.isSqz ? '<span class="tag bg-orange-500 text-black">MA_SQZ</span>' : ''}
                    </div>
                </div>
            `).join('');
    }

    async function toggleSystem() {
        if(isRunning) { isRunning = false; document.getElementById('sysBtn').innerText = "Start Radar"; return; }
        addLog("Booting Radar...", "text-blue-500");
        try {
            const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
            const data = await res.json();
            symbols = data.symbols.filter(s => s.quoteAsset === 'USDT' && s.status === 'TRADING').map(s => s.symbol).filter(s => !EXCLUDE.includes(s));
            isRunning = true;
            document.getElementById('sysBtn').innerText = "Stop Radar";
            scan();
        } catch(e) { addLog("API ERROR!", "text-red-500"); }
    }
    function togglePin(s) { pinned.has(s) ? pinned.delete(s) : pinned.add(s); render(); }
    const bind = (id, vid, key, div) => {
        document.getElementById(id).oninput = (e) => {
            const v = parseFloat(e.target.value); FILTER[key] = v / div;
            document.getElementById(vid).innerText = v + (key==='DRV'?'':'%');
        }
    };
    bind('i_slp', 'v_slp', 'SLP', 100);
    bind('i_drv', 'v_drv', 'DRV', 1);
    bind('i_poc', 'v_poc', 'POC', 1000);
    bind('i_sqz', 'v_sqz', 'SQZ', 1000);
</script>
</body>
</html>
