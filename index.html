<!DOCTYPE html>
<html>
<head>
    <title>⚡ DRIVE SNIPER V2.7 - 穩定趨勢版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; transition: all 0.5s; position: relative; }
        .pinned-card { border: 2px solid #00ff00 !important; background: #0f1a0f !important; }
        .log-container { background: #050505; border-left: 1px solid #1a3a1a; height: 100vh; overflow-y: auto; }
        .log-entry { border-bottom: 1px dashed #222; padding: 8px; font-size: 11px; cursor: pointer; }
        .timer-tag { font-size: 9px; background: #1a3a1a; color: #0f0; padding: 1px 4px; border-radius: 3px; }
        input[type=range] { accent-color: #0f0; }
    </style>
</head>
<body class="flex overflow-hidden">
    <div class="flex-1 p-5 overflow-y-auto h-screen">
        <div class="control-panel bg-zinc-900 p-4 mb-6 rounded-lg sticky top-0 z-50 border border-green-900/30">
            <div class="flex justify-between items-center mb-4 text-white">
                <h1 class="text-xl font-black text-green-500 italic uppercase">⚡ Sniper V2.7</h1>
                <div class="flex gap-2 text-white">
                    <input type="text" id="searchInput" placeholder="搜尋幣名..." class="bg-black border border-zinc-700 px-3 py-1 rounded text-xs text-green-400 outline-none w-48">
                    <button onclick="clearLogs()" class="bg-zinc-800 text-gray-400 px-2 py-1 rounded text-[10px]">清除日誌</button>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4 text-[10px]">
                <div class="space-y-1"><div class="flex justify-between text-red-500"><span>📉 Slope</span><span id="slp_val">-10.0%</span></div><input type="range" id="slp_range" min="-80" max="-1" value="-10" class="w-full"></div>
                <div class="space-y-1"><div class="flex justify-between text-yellow-500"><span>⚡ Drive</span><span id="drv_val">5000</span></div><input type="range" id="drv_range" min="0" max="20000" value="5000" step="500" class="w-full"></div>
                <div class="space-y-1"><div class="flex justify-between text-blue-400"><span>🔥 MOM (Vol%)</span><span id="mom_val">0.5%</span></div><input type="range" id="mom_range" min="0" max="50" value="5" class="w-full"></div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </div>

    <div class="w-80 log-container p-3">
        <div class="text-xs font-bold text-gray-500 mb-4 border-b border-gray-800 pb-2 uppercase italic">📋 Stable Detection Log</div>
        <div id="log-list" class="flex flex-col-reverse"></div>
    </div>

    <script>
        const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT'];
        let stats = {}, 
            boardState = {}, // 紀錄每隻幣在榜上的狀態 { startTime, lastSeen, hitCount }
            pinnedList = JSON.parse(localStorage.getItem('sniper_pinned')) || [];
        let FILTER = { SLP: -0.10, MOM: 0.005, DRV: 5000 };

        const searchInput = document.getElementById('searchInput');
        const list = document.getElementById('list');

        function addLog(s, drv, slp) {
            const logList = document.getElementById('log-list');
            const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<div class="flex justify-between"><strong>${s.replace('USDT','')}</strong><span class="text-gray-600">${time}</span></div>
                               <div class="text-[9px] text-gray-500">穩定上榜：DRV ${drv.toFixed(0)} | SLP ${(slp*100).toFixed(1)}%</div>`;
            logList.appendChild(entry);
        }

        async function update() {
            try {
                const [fRes, oResAll] = await Promise.all([
                    fetch('https://fapi.binance.com/fapi/v1/premiumIndex'),
                    fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')
                ]);
                const fData = await fRes.json(), oData = await oResAll.json();
                const now = Date.now();
                const keyword = searchInput.value.toUpperCase();
                let results = [];

                fData.forEach(c => {
                    const s = c.symbol;
                    if (!s.endsWith('USDT') || EXCLUDE.includes(s)) return;
                    const ticker = oData.find(t => t.symbol === s);
                    if (!ticker) return;

                    const fNow = parseFloat(c.lastFundingRate), pNow = parseFloat(ticker.lastPrice), vNow = parseFloat(ticker.quoteVolume);
                    if (!stats[s]) { stats[s] = { p: pNow, v: vNow, frHist: [fNow], drvHist: [] }; return; }

                    // 計算指標
                    stats[s].frHist.push(fNow); if (stats[s].frHist.length > 30) stats[s].frHist.shift();
                    const slope = (fNow - stats[s].frHist[0]) / Math.abs(stats[s].frHist[0] || 0.0001);
                    const pMove = Math.abs((pNow - stats[s].p) / stats[s].p) * 100;
                    const vMove = Math.abs((vNow - stats[s].v) / stats[s].v) * 100;
                    const instDrv = vMove > 0 ? (pMove / (vMove + 0.000001)) * 100 : 0;
                    stats[s].drvHist.push(instDrv); if (stats[s].drvHist.length > 50) stats[s].drvHist.shift();
                    const avgDrv = stats[s].drvHist.reduce((a,b)=>a+b,0) / stats[s].drvHist.length;
                    stats[s].p = pNow; stats[s].v = vNow;

                    const meetsCriteria = (slope <= FILTER.SLP && avgDrv >= FILTER.DRV && vMove >= FILTER.MOM);
                    
                    // 穩定性邏輯
                    if (meetsCriteria) {
                        if (!boardState[s]) boardState[s] = { hitCount: 0, startTime: null, lastSeen: now };
                        boardState[s].hitCount++;
                        boardState[s].lastSeen = now;
                        // 連續 3 次滿足才算正式上榜
                        if (boardState[s].hitCount === 3) {
                            boardState[s].startTime = now;
                            addLog(s, avgDrv, slope);
                        }
                    }

                    const isPinned = pinnedList.includes(s);
                    const isMatched = keyword && s.includes(keyword);
                    const isStableOnBoard = boardState[s] && boardState[s].startTime && (now - boardState[s].lastSeen < 30000); // 30秒緩衝

                    if (isPinned || isMatched || isStableOnBoard) {
                        const duration = isStableOnBoard ? Math.floor((now - boardState[s].startTime) / 1000) : 0;
                        results.push({ s, slope, avgDrv, price: pNow, isPinned, isMatched, duration });
                    }
                });

                list.innerHTML = '';
                results.sort((a,b) => (b.duration - a.duration) || (b.avgDrv - a.avgDrv)).forEach(item => {
                    const div = document.createElement('div');
                    div.className = `card p-3 rounded ${item.isPinned ? 'pinned-card' : ''}`;
                    div.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold ${item.isMatched ? 'text-blue-400' : 'text-white'}">${item.s.replace('USDT','')}</span>
                            ${item.duration > 0 ? `<span class="timer-tag">⏱️ ${item.duration}s</span>` : ''}
                        </div>
                        <div class="grid grid-cols-2 gap-1 mt-2 text-[10px]">
                            <div class="text-red-500">SLP: ${(item.slope*100).toFixed(1)}%</div>
                            <div class="text-yellow-500 font-bold">DRV: ${item.avgDrv.toFixed(0)}</div>
                        </div>`;
                    list.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }
        setInterval(update, 3000); update();
        // 滑桿綁定代碼同前 (略)
    </script>
</body>
</html>
