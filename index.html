<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V6.3.2 - FLEXIBLE FLOW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #e4e4e7; font-family: 'JetBrains Mono', monospace; overflow: hidden; }
        .panel { background: linear-gradient(145deg, #18181b, #09090b); border: 1px solid #27272a; }
        .card { background: #09090b; border: 1px solid #18181b; position: relative; transition: 0.2s; overflow: hidden; }
        
        /* 真動能-強效呼吸燈 */
        .sniper-trigger { 
            border: 2px solid #ef4444 !important; 
            background: #450a0a !important; 
            animation: blink-red 0.6s infinite ease-in-out !important; 
        }
        .hunter-trigger { 
            border: 2px solid #facc15 !important; 
            background: #422006 !important; 
            animation: blink-yellow 1s infinite ease-in-out !important; 
        }
        .fading { opacity: 0.4; filter: grayscale(1); animation: none !important; border-style: dashed !important; }
        
        @keyframes blink-red { 
            0%, 100% { box-shadow: inset 0 0 25px #7f1d1d, 0 0 15px #ef4444; transform: scale(1.02); } 
            50% { box-shadow: inset 0 0 5px #7f1d1d, 0 0 2px #7f1d1d; transform: scale(1); } 
        }
        @keyframes blink-yellow { 
            0%, 100% { box-shadow: inset 0 0 15px #713f12, 0 0 10px #facc15; } 
            50% { box-shadow: inset 0 0 2px #713f12; } 
        }
        
        /* 彈性日誌區：不綁死，隨內容動 */
        #log-area { flex: 0 0 auto; min-width: 280px; max-width: 400px; transition: all 0.3s; }
        #logs::-webkit-scrollbar { width: 4px; }
        #logs::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        
        input[type=range] { -webkit-appearance: none; background: #333; height: 6px; border-radius: 3px; width: 100%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #fff; cursor: pointer; border: 3px solid #ef4444; }
    </style>
</head>
<body class="flex h-screen w-screen">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="panel p-6 rounded-2xl mb-4 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-black italic text-white uppercase tracking-tighter">Sniper V6.3.2 <span class="text-red-600 text-xs not-italic ml-2">真動能鑑定</span></h1>
                <div class="flex gap-3">
                    <button id="fuelBtn" onclick="toggleFuel()" class="bg-zinc-800 border border-zinc-700 px-4 py-1.5 rounded-lg font-black text-purple-400 text-[10px] uppercase transition-all">⚓ Fuel Mode</button>
                    <input type="text" id="search" onkeydown="handleSearch(event)" placeholder="SYMBOL & ENTER" class="bg-black border border-zinc-700 px-3 py-1.5 rounded-lg text-blue-400 outline-none w-40 font-black focus:border-red-500">
                </div>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="space-y-2">
                    <div class="flex justify-between font-black text-red-500 text-[10px]"><span>🔴 SNIPER (真動能)</span><span id="flash_val">35%</span></div>
                    <input type="range" id="flash_range" min="1" max="60" value="35">
                    <p class="text-[8px] text-red-400/70 font-bold">💎 建議 35% 以上防騙線</p>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-black text-yellow-500 text-[10px]"><span>🟡 HUNTER (大肉)</span><span id="slp_val">-2.0%</span></div>
                    <input type="range" id="slp_range" min="-800" max="0" value="-20">
                    <p class="text-[8px] text-yellow-500/70 font-bold">📈 建議 -2.0% 抓起點</p>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-black text-purple-500 text-[10px]"><span>⚓ FUEL</span><span id="fuel_val">15%</span></div>
                    <input type="range" id="fuel_range" min="1" max="60" value="15">
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-black text-blue-500 text-[10px]"><span>💎 VAC 真空</span><span id="vac_val">150</span></div>
                    <input type="range" id="vac_range" min="10" max="500" value="150">
                </div>
            </div>
        </div>

        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pr-2"></div>
    </div>

    <div id="log-area" class="bg-black border-l border-zinc-900 flex flex-col p-4">
        <div class="text-zinc-600 font-black text-center mb-4 pb-2 border-b border-zinc-800 text-[10px] tracking-widest uppercase italic">Combat Status</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-2 flex flex-col-reverse justify-end">
            </div>
        <button onclick="testPush()" class="mt-4 bg-zinc-900 hover:bg-zinc-800 text-zinc-500 py-3 rounded-xl font-black text-[9px] transition-all">TEST PUSH</button>
    </div>

<script>
    const P_USER = "Gkhqyhobnxzjfwgvaiyp347m1jkhn4", P_TOKEN = "acyoe3sz15x491r1349fdcau7x6pw";
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    const LOCK_TIME = 180000;
    let stats = {}, keyword = "";
    let SETTINGS = { SLP: -0.02, FLASH: 0.35, FUEL: 0.15, VAC: 150, USE_FUEL: true };

    async function push(t, m) { fetch('https://api.pushover.net/1/messages.json',{method:'POST',body:new URLSearchParams({token:P_TOKEN,user:P_USER,title:t,message:m})}); }
    
    function addLog(m, c="text-zinc-500") {
        const l = document.getElementById('logs');
        const d = document.createElement('div');
        d.className = `pl-2 border-l-2 border-zinc-800 py-1 ${c} font-bold text-[10px] animate-pulse`;
        d.innerHTML = `<span class="opacity-30 text-[8px]">${new Date().toLocaleTimeString()}</span> ${m}`;
        l.prepend(d);
        if(l.children.length > 40) l.lastChild.remove();
    }

    function handleSearch(e) { if(e.key==='Enter') keyword = e.target.value.toUpperCase(); }
    function toggleFuel() { SETTINGS.USE_FUEL=!SETTINGS.USE_FUEL; document.getElementById('fuelBtn').classList.toggle('text-white'); addLog("Mode Toggled", "text-blue-400"); }
    function testPush() { push("PING", "V6.3.2 READY"); addLog("CONNECTION OK", "text-green-500"); }

    async function update() {
        try {
            const [fRes, tRes] = await Promise.all([fetch('https://fapi.binance.com/fapi/v1/premiumIndex'), fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')]);
            const fData = await fRes.json(), tData = await tRes.json();
            const tMap = new Map(tData.map(t=>[t.symbol, t]));

            let results = [];
            fData.forEach(c => {
                const s = c.symbol; if(!s.endsWith('USDT')) return;
                if(EXCLUDE.includes(s) && !s.includes(keyword)) return;

                const ticker = tMap.get(s); if(!ticker) return;
                const pNow = parseFloat(ticker.lastPrice), fNow = parseFloat(c.lastFundingRate);
                const vNow = parseFloat(ticker.quoteVolume), wap = parseFloat(ticker.weightedAvgPrice);

                if(!stats[s]) stats[s]={ lastV:vNow, vDeltas:[], pHist:[], lastS:0, lastH:0, lastFR:fNow };
                
                const vDelta = vNow - stats[s].lastV; 
                stats[s].lastV = vNow;
                stats[s].vDeltas.push(vDelta); if(stats[s].vDeltas.length > 120) stats[s].vDeltas.shift();
                stats[s].pHist.push(pNow); if(stats[s].pHist.length > 30) stats[s].pHist.shift();
                
                const avgVol = stats[s].vDeltas.reduce((a,b)=>a+b,0) / stats[s].vDeltas.length;
                const impact = vDelta / (avgVol || 1);
                const flash = (pNow - (stats[s].pHist[0] || pNow)) / (parseFloat(ticker.highPrice) - parseFloat(ticker.lowPrice) || 1);
                const isTrending = stats[s].pHist.slice(-3).every((v, i, a) => i === 0 || v >= a[i-1]);
                const distWap = (pNow - wap) / wap;

                const isSNow = (impact > 5.0) && (flash >= SETTINGS.FLASH) && isTrending && (distWap > 0.012);
                const isHNow = (impact > 1.5) && (flash >= 0.15) && (pNow > wap);

                if(isSNow) {
                    if(Date.now() - stats[s].lastS > 300000) {
                        push(`🔥 真動能: ${s}`, `成交量衝擊: ${impact.toFixed(1)}x`);
                        addLog(`🔥 [真動能] ${s} 發動`, "text-red-500 underline");
                    }
                    stats[s].lastS = Date.now();
                }
                if(isHNow) stats[s].lastH = Date.now();

                const isS = (Date.now() - stats[s].lastS) < LOCK_TIME;
                const isH = (Date.now() - stats[s].lastH) < LOCK_TIME;

                if(isS || isH || (SETTINGS.USE_FUEL && fNow < SETTINGS.SLP) || (keyword && s.includes(keyword))) {
                    results.push({ s, pNow, wap, distWap, isS, isH, isSNow, isHNow, sAge:Date.now()-stats[s].lastS, hAge:Date.now()-stats[s].lastH, isF: fNow < SETTINGS.SLP });
                }
            });

            results.sort((a,b) => (b.isS - a.isS) || (b.isH - a.isH) || (b.distWap - a.distWap));
            render(results);
        } catch(e) {}
    }

    function render(data) {
        const l = document.getElementById('list'); l.innerHTML = '';
        data.forEach((item, idx) => {
            let cls = "", label = "WATCH", age = 0;
            if(item.isS) { cls = "sniper-trigger"; label = "🔴 SNIPER"; age = item.sAge; if(!item.isSNow) cls += " fading"; }
            else if(item.isH) { cls = "hunter-trigger"; label = "🟡 HUNTER"; age = item.hAge; if(!item.isHNow) cls += " fading"; }
            else if(item.isF) { cls = "fuel-trigger"; label = "⚓ FUEL"; }

            const div = document.createElement('div');
            div.className = `card p-5 rounded-2xl ${cls}`;
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-white font-black text-xl italic tracking-tighter">${item.s.replace('USDT','')}</div>
                        <div class="text-[9px] font-bold ${item.distWap>0?'text-green-400':'text-red-400'}">GAP: ${(item.distWap*100).toFixed(2)}%</div>
                    </div>
                    <div class="text-right">
                        <div class="text-white font-black text-lg">$${item.pNow.toFixed(item.pNow<1?5:2)}</div>
                        <div class="text-[8px] text-zinc-500 font-bold uppercase tracking-tighter">WAP: ${item.wap.toFixed(item.wap<1?4:2)}</div>
                    </div>
                </div>
                <div class="mt-4 pt-3 border-t border-white/5 flex justify-between items-center text-[9px] font-black">
                    <span class="text-zinc-700 uppercase">RANK ${idx+1}</span>
                    <span class="${item.isSNow || item.isHNow ? 'text-white animate-pulse' : 'text-zinc-600'}">${label} ${age > 0 ? (Math.ceil((LOCK_TIME-age)/1000)+'s') : ''}</span>
                </div>
            `;
            l.appendChild(div);
        });
    }

    setInterval(update, 3000);
    document.getElementById('flash_range').oninput = function() { SETTINGS.FLASH = this.value/100; document.getElementById('flash_val').innerText = this.value+'%'; }
    document.getElementById('slp_range').oninput = function() { SETTINGS.SLP = this.value/1000; document.getElementById('slp_val').innerText = (this.value/10).toFixed(1)+'%'; }
</script>
</body>
</html>
