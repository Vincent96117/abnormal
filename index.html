<!DOCTYPE html>
<html>
<head>
    <title>⚡ DRIVE SNIPER V5.1.3 - 邏輯修正版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; cursor: pointer; transition: all 0.2s; }
        .card:hover { border-color: #3b82f6; }
        .pinned { border: 2px solid #3b82f6 !important; background: #081221 !important; }
        /* 增加：當符合你所有嚴格條件時，卡片變紫色閃爍 */
        .hunt-trigger { border: 2px solid #a855f7 !important; background: #1e1b4b !important; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .score-val { font-size: 1.5rem; font-weight: 900; color: #eab308; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="bg-zinc-900 p-4 rounded-xl mb-4 border border-white/10">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-black text-blue-500 italic uppercase italic">⚡ Sniper V5.1.3</h1>
                <input type="text" id="searchInput" placeholder="搜尋 (如: KOMA)..." class="bg-black border border-zinc-800 px-3 py-1 rounded text-sm text-blue-400 outline-none w-48">
            </div>
            <div class="grid grid-cols-3 gap-4 text-[10px] font-bold uppercase">
                <div class="text-red-500">📉 Slope Limit: <span id="slp_val">-5%</span></div>
                <div class="text-yellow-500">💯 Vacuum Limit: <span id="drv_val">60</span></div>
                <div class="text-blue-400">⚡ Vol Boost: <span id="vol_val">1.2x</span></div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pr-2"></div>
    </div>

    <div class="w-80 bg-zinc-950 border-l border-zinc-800 flex flex-col p-4">
        <div class="text-xs font-black text-zinc-500 mb-4 border-b border-zinc-800 pb-2 uppercase">System Logs</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-1 text-[10px]"></div>
    </div>

<script>
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    let stats = {}, pinned = new Set(), FILTER = { SLP: -0.05, DRV_SCORE: 60, VOL_RATIO: 1.2 };

    function addLog(msg, color="text-zinc-600") {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = `${color} border-l border-zinc-800 pl-2`;
        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logs.prepend(div);
        if (logs.children.length > 50) logs.lastChild.remove();
    }

    // 將原始天文數字轉為 0-100 分的轉換函數 (底層邏輯不動)
    function calculateScore(d) {
        if (d < 1000) return Math.round((d / 1000) * 20);
        if (d < 5000) return Math.round(20 + ((d - 1000) / 4000) * 40);
        if (d < 15000) return Math.round(60 + ((d - 5000) / 10000) * 30);
        return Math.round(90 + Math.min(10, (d - 15000) / 5000));
    }

    async function update() {
        try {
            const [fRes, oRes] = await Promise.all([
                fetch('https://fapi.binance.com/fapi/v1/premiumIndex'),
                fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')
            ]);
            const fData = await fRes.json(), oData = await oRes.json();
            let results = [];
            const keyword = document.getElementById('searchInput').value.toUpperCase();

            fData.filter(c => c.symbol.endsWith('USDT') && !EXCLUDE.includes(c.symbol)).forEach(c => {
                const s = c.symbol;
                const ticker = oData.find(t => t.symbol === s);
                if (!ticker) return;

                const fNow = parseFloat(c.lastFundingRate), pNow = parseFloat(ticker.lastPrice), vNow = parseFloat(ticker.quoteVolume);
                if (!stats[s]) { 
                    stats[s] = { p: pNow, v: vNow, vHist: [vNow], frHist: [fNow], drvHist: [], start: Date.now() }; 
                    return; 
                }

                // 核心計算
                stats[s].vHist.push(vNow); if (stats[s].vHist.length > 30) stats[s].vHist.shift();
                const volRatio = vNow / (stats[s].vHist.reduce((a,b)=>a+b,0)/stats[s].vHist.length || 1);
                
                stats[s].frHist.push(fNow); if (stats[s].frHist.length > 30) stats[s].frHist.shift();
                const slope = (fNow - stats[s].frHist[0]) / Math.abs(stats[s].frHist[0] || 0.0001);
                
                const vDelta = Math.abs(vNow - stats[s].v);
                const pDelta = Math.abs(pNow - stats[s].p) / stats[s].p;
                const instDrv = vDelta > 0 ? (pDelta / vDelta) * 100000000 : 0;
                stats[s].drvHist.push(instDrv); if (stats[s].drvHist.length > 30) stats[s].drvHist.shift();
                const avgDrv = stats[s].drvHist.reduce((a,b)=>a+b,0) / stats[s].drvHist.length;
                
                const filterScore = calculateScore(avgDrv);
                const isPinned = pinned.has(s);
                const isSearching = keyword && s.includes(keyword);
                
                // 檢查是否達成你的「發動條件」
                const isTriggered = (slope <= FILTER.SLP && filterScore >= FILTER.DRV_SCORE && volRatio >= FILTER.VOL_RATIO);

                // 修改顯示邏輯：
                // 1. 符合發動條件必顯
                // 2. 釘選必顯
                // 3. 搜尋中必顯
                // 4. 預設顯示分數前 12 名 (就算沒發動也讓你看到程式在跑)
                if (isTriggered || isPinned || isSearching || filterScore > 20) {
                    results.push({
                        s, slope, fNow, volRatio, isPinned, isTriggered, filterScore,
                        rawScore: Math.round(avgDrv).toLocaleString(),
                        price: pNow, sec: Math.floor((Date.now()-stats[s].start)/1000)
                    });
                }
                if (isTriggered && !stats[s].logged) {
                    addLog(`🔥 偵測到發動: ${s} Score: ${Math.round(avgDrv)}`, "text-purple-400 font-bold");
                    stats[s].logged = true;
                } else if (!isTriggered) { stats[s].logged = false; }
                
                stats[s].p = pNow; stats[s].v = vNow;
            });

            const list = document.getElementById('list'); list.innerHTML = '';
            // 排序：發動中 > 釘選 > 分數
            results.sort((a,b) => b.isTriggered - a.isTriggered || b.isPinned - a.isPinned || b.filterScore - a.filterScore);

            results.slice(0, 24).forEach(item => {
                const div = document.createElement('div');
                div.className = `card p-4 rounded-xl ${item.isTriggered ? 'hunt-trigger' : (item.isPinned ? 'pinned' : '')}`;
                div.onclick = () => { pinned.has(item.s) ? pinned.delete(item.s) : pinned.add(item.s); };
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-white font-black text-xl">${item.isPinned ? '📌 ' : ''}${item.s.replace('USDT','')}</div>
                            <div class="text-[10px] text-zinc-500 font-bold">SLP: ${(item.slope*100).toFixed(2)}% | FR: ${(item.fNow*100).toFixed(3)}%</div>
                        </div>
                        <div class="text-right">
                            <div class="score-val">${item.rawScore}</div>
                            <div class="text-[8px] text-zinc-600 font-black uppercase tracking-widest">Raw Vacuum</div>
                        </div>
                    </div>
                    <div class="mt-3 flex items-center space-x-2">
                        <div class="flex-1 bg-zinc-900 h-1.5 rounded-full overflow-hidden">
                            <div class="h-full ${item.isTriggered ? 'bg-purple-500' : 'bg-blue-500'}" style="width: ${Math.min(100, item.volRatio * 20)}%"></div>
                        </div>
                        <span class="${item.isTriggered ? 'text-purple-400' : 'text-blue-400'} font-black text-xs">${item.volRatio.toFixed(1)}x</span>
                    </div>
                `;
                list.appendChild(div);
            });
        } catch (e) { addLog("Error: " + e.message, "text-red-500"); }
    }

    setInterval(update, 3000); update();
    addLog("驅動獵人系統已啟動...", "text-green-500");
</script>
</body>
</html>
