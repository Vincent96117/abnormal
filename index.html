<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V6.5.2 - STABLE TOP 6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
        .panel { background: #0a0a0a; border-bottom: 2px solid #1a1a1a; position: sticky; top: 0; z-index: 100; }
        .card { background: #09090b; border: 1px solid #18181b; min-height: 140px; }
        .sniper-trigger { border: 2px solid #ef4444 !important; background: #450a0a !important; animation: blink-red 0.6s infinite !important; }
        @keyframes blink-red { 0%, 100% { box-shadow: 0 0 20px #7f1d1d; } 50% { box-shadow: 0 0 5px #7f1d1d; } }
        .active-fuel { background: #a855f7 !important; color: white !important; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[11px]">
    <div class="flex-1 flex flex-col overflow-hidden">
        <div class="panel p-5">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-black italic text-white tracking-tighter">V6.5.2 <span class="text-red-600 italic">SNIPER</span></h1>
                    <div class="text-[9px] text-zinc-500 font-bold uppercase mt-1">Status: Stable Potential Ranking</div>
                </div>
                <div class="flex gap-4">
                    <button id="fuelBtn" onclick="toggleFuel()" class="bg-zinc-900 border border-zinc-700 px-6 py-2 rounded-xl text-purple-400 font-black text-[10px]">⚓ Fuel Mode</button>
                    <input type="text" id="search" onkeydown="handleSearch(event)" placeholder="SYMBOL & ENTER" class="bg-black border border-zinc-800 px-4 py-2 rounded-xl text-blue-400 outline-none w-48 focus:border-red-600">
                </div>
            </div>
            <div class="grid grid-cols-4 gap-6">
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-white/5">
                    <div class="flex justify-between text-red-500"><span class="text-[10px]">🔴 SNIPER</span><span id="flash_val" class="text-white text-sm font-black">20%</span></div>
                    <input type="range" id="flash_range" min="1" max="60" value="20" oninput="updateVal('flash', this.value)">
                </div>
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-white/5">
                    <div class="flex justify-between text-yellow-500"><span class="text-[10px]">🟡 HUNTER SLP</span><span id="slp_val" class="text-white text-sm font-black">-2.5%</span></div>
                    <input type="range" id="slp_range" min="-800" max="0" value="-25" oninput="updateVal('slp', this.value)">
                </div>
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-white/5">
                    <div class="flex justify-between text-purple-500"><span class="text-[10px]">⚓ FUEL RATIO</span><span id="fuel_val" class="text-white text-sm font-black">10%</span></div>
                    <input type="range" id="fuel_range" min="1" max="60" value="10" oninput="updateVal('fuel', this.value)">
                </div>
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-white/5">
                    <div class="flex justify-between text-blue-500"><span class="text-[10px]">💎 VAC LIMIT</span><span id="vac_val" class="text-white text-sm font-black">120</span></div>
                    <input type="range" id="vac_range" min="10" max="500" value="120" oninput="updateVal('vac', this.value)">
                </div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 p-5 overflow-y-auto"></div>
    </div>

    <div class="w-80 bg-black border-l border-zinc-900 flex flex-col">
        <div class="p-4 border-b border-zinc-900">
            <div class="text-blue-500 font-black text-[10px] uppercase italic mb-3">🔥 今日潛力動能 (TOP 6)</div>
            <div id="potential-list" class="space-y-2 text-[10px]"></div>
        </div>
        <div class="flex-1 overflow-hidden p-4">
            <div id="logs" class="space-y-2"></div>
        </div>
    </div>

<script>
    const P_USER = "Gkhqyhobnxzjfwgvaiyp347m1jkhn4", P_TOKEN = "acyoe3sz15x491r1349fdcau7x6pw";
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    const LOCK_TIME = 180000;
    let stats = {}, pinned = new Set(), keyword = "", baselineData = {};
    let SETTINGS = { SLP: -0.025, FLASH: 0.20, FUEL: 0.10, VAC: 120, USE_FUEL: true };

    function updateVal(key, val) {
        if(key === 'flash') SETTINGS.FLASH = val/100; 
        if(key === 'slp') SETTINGS.SLP = val/1000;
        document.getElementById(key+'_val').innerText = (key==='slp'?(val/10)+'%':val+'%');
    }

    async function initBaselines() {
        const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
        const data = await res.json();
        const targets = data.filter(s => s.symbol.endsWith('USDT') && !EXCLUDE.includes(s.symbol)).sort((a,b)=>b.quoteVolume-a.quoteVolume).slice(0, 100);
        for(let s of targets) {
            const [k, h] = await Promise.all([
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${s.symbol}&interval=1d&limit=5`).then(r=>r.json()),
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${s.symbol}&interval=1h&limit=120`).then(r=>r.json())
            ]);
            let tV=0, tQ=0, tA=0; k.forEach(v=>{ tA+=(v[2]-v[3])/v[1]; tV+=parseFloat(v[5]); tQ+=parseFloat(v[7]); });
            baselineData[s.symbol] = { avgAmp: tA/5, wap5d: tQ/tV, avgTradesHr: h.reduce((a,c)=>a+parseInt(c[8]),0)/120 };
        }
    }

    async function update() {
        try {
            const [fRes, tRes] = await Promise.all([fetch('https://fapi.binance.com/fapi/v1/premiumIndex'), fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')]);
            const fData = await fRes.json(), tData = await tRes.json(), tMap = new Map(tData.map(t=>[t.symbol,t]));
            let results = [], strongPool = [], backupPool = [];
            const now = Date.now();

            fData.forEach(c => {
                const s = c.symbol; if(!s.endsWith('USDT') || EXCLUDE.includes(s)) return;
                const t = tMap.get(s); if(!t || !baselineData[s]) return;
                const pNow = parseFloat(t.lastPrice), trades = parseInt(t.count);
                if(!stats[s]) stats[s]={ lastV:parseFloat(t.quoteVolume), vDeltas:[], pHist:[], lastS:0, hourStart: new Date().setMinutes(0,0,0), startTrades: trades };
                
                const vDelta = Math.max(0, parseFloat(t.quoteVolume) - stats[s].lastV); stats[s].lastV = parseFloat(t.quoteVolume);
                stats[s].pHist.push(pNow); if(stats[s].pHist.length>50) stats[s].pHist.shift();
                
                const distWap = (pNow - parseFloat(t.weightedAvgPrice))/parseFloat(t.weightedAvgPrice);
                if(vDelta > (Math.max(...stats[s].vDeltas||[0])*1.1) && distWap > 0.003) stats[s].lastS = now;

                const vScore = ((t.highPrice-t.lowPrice)/t.openPrice) / baselineData[s].avgAmp;
                const hScore = ((trades - stats[s].startTrades)*(60/Math.max(1,(now-stats[s].hourStart)/60000))) / baselineData[s].avgTradesHr;
                const wapGap = ((pNow / baselineData[s].wap5d) - 1)*100;
                const isAbove = pNow > baselineData[s].wap5d;

                const item = { s, vScore, hScore, wapGap, wap5d: baselineData[s].wap5d, pNow, score: (vScore*0.5 + hScore*0.5) };
                if (isAbove && vScore > 1.1) { item.status = "🔴 強"; strongPool.push(item); }
                else { item.status = !isAbove ? "⚪ 補(低WAP)" : "⚪ 補(低動能)"; backupPool.push(item); }

                if((now-stats[s].lastS)<LOCK_TIME || pinned.has(s)) results.push({ s, pNow, distWap, isS:true });
            });

            // 核心排序：強勢優先，不夠才補
            strongPool.sort((a,b)=>b.score - a.score);
            backupPool.sort((a,b)=>b.score - a.score);
            const finalTop6 = [...strongPool, ...backupPool].slice(0,6);
            
            renderPotentials(finalTop6);
            render(results);
        } catch(e){}
    }

    function renderPotentials(top6) {
        const l = document.getElementById('potential-list'); l.innerHTML = '';
        top6.forEach(item => {
            const div = document.createElement('div');
            div.className = "bg-zinc-900/40 p-3 rounded-xl border border-white/5 space-y-1";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="font-black text-white">${item.s.replace('USDT','')} <span class="${item.status.includes('強')?'text-red-500':'text-zinc-500'} text-[8px]">${item.status}</span></span>
                    <span class="text-zinc-500">$${item.pNow.toFixed(item.pNow<1?4:2)}</span>
                </div>
                <div class="flex justify-between text-[9px] font-bold">
                    <span class="text-zinc-600">5D-WAP: $${item.wap5d.toFixed(item.wap5d<1?4:2)}</span>
                    <span class="${item.wapGap>0?'text-green-500':'text-red-500'}">${item.wapGap>0?'+':''}${item.wapGap.toFixed(2)}%</span>
                </div>
                <div class="flex justify-between text-[8px] uppercase">
                    <span class="text-blue-400">💓 Speed: ${item.hScore.toFixed(1)}x</span>
                    <span class="text-purple-400">🌊 Volat: ${item.vScore.toFixed(1)}x</span>
                </div>`;
            l.appendChild(div);
        });
    }

    function render(data) {
        const l = document.getElementById('list'); l.innerHTML = '';
        data.forEach(i => {
            const d = document.createElement('div'); d.className = `card p-5 rounded-2xl sniper-trigger`;
            d.innerHTML = `<div class="flex justify-between"><div><div class="text-white font-black text-xl italic">${i.s.replace('USDT','')}</div><div class="text-green-500 font-bold mt-1">GAP: ${(i.distWap*100).toFixed(2)}%</div></div><div class="text-white font-black text-lg">$${i.pNow.toFixed(i.pNow<1?4:2)}</div></div>`;
            l.appendChild(d);
        });
    }

    initBaselines(); setInterval(update, 3000);
    function handleSearch(e){ if(e.key==='Enter'){ keyword=e.target.value.toUpperCase(); if(keyword) pinned.add(keyword); }}
    function toggleFuel(){ SETTINGS.USE_FUEL=!SETTINGS.USE_FUEL; document.getElementById('fuelBtn').classList.toggle('active-fuel'); }
</script>
</body>
</html>
