<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V5.5 - ULTIMATE OPTIMIZED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; overflow: hidden; }
        .card { background: #0a0a0a; border: 1px solid #1a1a1a; transition: 0.2s; cursor: pointer; }
        .hunt-trigger { border: 2px solid #a855f7 !important; background: #1e1b4b !important; animation: blink 1.2s infinite; }
        .funding-danger { border: 2px solid #ef4444 !important; background: #290a0a !important; }
        @keyframes blink { 0%, 100% { border-color: #a855f7; } 50% { border-color: #3b0764; } }
        .tag { font-size: 8px; padding: 1px 3px; font-weight: 900; border-radius: 2px; text-transform: uppercase; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #222; }
    </style>
</head>
<body class="flex h-screen text-[11px]">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="bg-zinc-900/80 p-5 rounded-2xl mb-4 border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col">
                    <h1 class="text-2xl font-black text-blue-500 italic uppercase tracking-tighter">⚡ Sniper V5.5 <span class="text-xs text-zinc-500 not-italic">Optimized</span></h1>
                    <div id="status" class="text-[9px] text-zinc-500 font-bold mt-1 uppercase">Ready to Scan...</div>
                </div>
                <div class="flex gap-3">
                    <input type="text" id="searchInput" placeholder="SEARCH SYMBOL..." class="bg-black border border-zinc-800 px-4 py-1 rounded-lg text-blue-400 outline-none w-40 uppercase">
                    <button id="sysBtn" onclick="toggleSystem()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-1 rounded-lg font-black uppercase transition-all shadow-[0_0_20px_rgba(37,99,235,0.4)]">Start Radar</button>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-8 uppercase font-black">
                <div class="space-y-1">
                    <div class="flex justify-between text-red-500"><span>📉 Slope (燃料)</span><span id="v_slp">-5%</span></div>
                    <input type="range" id="i_slp" min="-50" max="0" value="-5" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-yellow-500"><span>💯 Vacuum (真空)</span><span id="v_drv">90</span></div>
                    <input type="range" id="i_drv" min="0" max="100" value="90" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-blue-400"><span>⚡ Vol Ratio</span><span id="v_vol">1.2x</span></div>
                    <input type="range" id="i_vol" min="10" max="50" value="12" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pr-2"></div>
    </div>
    <div class="w-72 bg-zinc-950 border-l border-zinc-900 p-4 flex flex-col">
        <div class="text-zinc-600 font-black mb-3 border-b border-zinc-800 pb-2 text-[10px] uppercase">Wave & Push Logs</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-2 font-mono text-[10px]"></div>
    </div>

<script>
    const P_USER = "Gkhqyhobnxzjfwgvaiyp347m1jkhn4";
    const P_TOKEN = "acyoe3sz15x4n91r1349fdcau7x6pw";
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    
    let stats = {}, pinned = new Set(), isRunning = false, symbols = [];
    let FILTER = { SLP: -0.05, DRV: 90, VOL: 1.2 };

    function addLog(msg, color="text-zinc-500") {
        const div = document.createElement('div');
        div.className = `border-l-2 border-zinc-800 pl-2 py-1 ${color}`;
        div.innerHTML = `[${new Date().toLocaleTimeString('zh-TW', {hour12:false})}] ${msg}`;
        document.getElementById('logs').prepend(div);
    }

    function sendPush(symbol, slope, drv, price, type = "START") {
        const title = type === "START" ? `🎯 V5.5: ${symbol} 紫框發動` : `⚠️ V5.5: ${symbol} 訊號解除`;
        const sound = type === "START" ? "alien" : "falling";
        const msg = type === "START" ? 
            `🚀 燃料與真空共振！\n現價: ${price}\n5M斜率: ${(slope*100).toFixed(1)}%\n真空度: ${Math.round(drv)}` :
            `🛑 訊號已消失。\n結束價: ${price}`;

        fetch('https://api.pushover.net/1/messages.json', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ token: P_TOKEN, user: P_USER, title, message: msg, priority: 1, sound })
        });
    }

    async function fetchData(s) {
        try {
            const [tRes, fRes] = await Promise.all([
                fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${s}`),
                fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${s}`)
            ]);
            const t = await tRes.json(), f = await fRes.json();
            
            const pNow = parseFloat(t.lastPrice);
            const vNow = parseFloat(t.quoteVolume);
            const fNow = parseFloat(f.lastFundingRate);
            const zoneP = (parseFloat(t.highPrice) + parseFloat(t.lowPrice)) / 2;

            if(!stats[s]) stats[s] = { vHist:[], frHist:[], lastP:pNow, lastV:vNow, pushLogged:false };
            
            // 數據累積 (5分鐘深度)
            stats[s].vHist.push(vNow); if(stats[s].vHist.length > 100) stats[s].vHist.shift();
            stats[s].frHist.push(fNow); if(stats[s].frHist.length > 100) stats[s].frHist.shift();

            const avgVol = stats[s].vHist.reduce((a,b)=>a+b,0)/stats[s].vHist.length;
            const volR = vNow / (avgVol || 1);
            const slope = (fNow - stats[s].frHist[0]) / (Math.abs(stats[s].frHist[0]) || 0.0001);
            
            // 真空得分
            const pDelta = Math.abs(pNow - stats[s].lastP) / stats[s].lastP;
            const vDelta = Math.abs(vNow - stats[s].lastV);
            const drvRaw = vDelta > 0 ? (pDelta / vDelta) * 100000000 : 0;
            const score = Math.min(100, (drvRaw / 500)); // 簡易映射

            // 觸發判定
            const isTriggered = (slope <= FILTER.SLP && score >= FILTER.DRV && volR >= FILTER.VOL);
            const isDanger = Math.abs(fNow) >= 0.0005;

            if(isTriggered && !stats[s].pushLogged) {
                sendPush(s.replace('USDT',''), slope, score, pNow, "START");
                stats[s].pushLogged = true;
                addLog(`🎯 推播發送: ${s} 紫框確立`, "text-purple-400 font-black");
            } else if(!isTriggered && stats[s].pushLogged) {
                sendPush(s.replace('USDT',''), 0, 0, pNow, "END");
                stats[s].pushLogged = false;
                addLog(`🛑 推播發送: ${s} 訊號解除`, "text-zinc-500 font-bold");
            }

            stats[s].lastP = pNow; stats[s].lastV = vNow;
            return { s, price: pNow, fRate: fNow, slope, score, volR, zoneP, isTriggered, isDanger };
        } catch(e) { return null; }
    }

    async function scan() {
        if(!isRunning) return;
        const batch = symbols.slice(0, 10);
        symbols = [...symbols.slice(10), ...batch];
        for(let s of batch) {
            const data = await fetchData(s);
            if(data) stats[s] = { ...stats[s], ...data };
        }
        render();
        setTimeout(scan, 2000);
    }

    function render() {
        const list = document.getElementById('list');
        const search = document.getElementById('searchInput').value.toUpperCase();
        const results = Object.values(stats).filter(x => x.s && x.s.includes(search));
        
        list.innerHTML = results
            .sort((a,b) => (pinned.has(b.s)-pinned.has(a.s)) || (b.isTriggered ? 1 : -1) || (Math.abs(b.fRate)-Math.abs(a.fRate)))
            .slice(0, 24)
            .map(x => `
                <div class="card p-4 rounded-xl ${x.isTriggered ? 'hunt-trigger' : ''} ${x.isDanger ? 'funding-danger' : ''} ${pinned.has(x.s) ? 'pinned' : ''}" onclick="togglePin('${x.s}')">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-white font-black text-lg">${pinned.has(x.s)?'📌 ':''}${x.s.replace('USDT','')}</div>
                            <div class="text-[9px] ${x.slope < 0 ? 'text-red-500' : 'text-zinc-500'} font-bold">SLP: ${(x.slope*100).toFixed(1)}% | FR: ${(x.fRate*100).toFixed(3)}%</div>
                        </div>
                        <div class="text-right">
                            <div class="text-yellow-500 font-black text-[10px]">VACUUM: ${Math.round(x.score)}</div>
                            <div class="text-white font-black text-base">$${x.price < 1 ? x.price.toFixed(5) : x.price.toFixed(3)}</div>
                        </div>
                    </div>
                    <div class="mt-3 flex justify-between items-center text-[10px]">
                        <div class="text-zinc-500 font-bold uppercase">Zone: ${x.zoneP.toFixed(4)} ${x.price > x.zoneP ? '<span class="text-green-500">▲</span>' : '<span class="text-red-500">▼</span>'}</div>
                        <div class="text-blue-400 font-bold">Vol: ${x.volR.toFixed(1)}x</div>
                    </div>
                    ${x.isTriggered ? '<div class="mt-2 text-center py-0.5 bg-purple-600 text-black font-black rounded text-[9px] animate-pulse">🎯 SNIPER TRIGGERED</div>' : ''}
                </div>
            `).join('');
    }

    async function toggleSystem() {
        if(isRunning) { isRunning = false; document.getElementById('sysBtn').innerText = "Start Radar"; return; }
        addLog("正在連線幣安行情庫...", "text-blue-500");
        try {
            const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
            const data = await res.json();
            symbols = data.symbols.filter(s => s.quoteAsset === 'USDT' && s.status === 'TRADING').map(s => s.symbol).filter(s => !EXCLUDE.includes(s));
            isRunning = true;
            document.getElementById('sysBtn').innerText = "Stop Radar";
            document.getElementById('status').innerText = `Scanned ${symbols.length} Pairs | Live`;
            scan();
        } catch(e) { addLog("連線錯誤，請檢查網路", "text-red-500"); }
    }
    function togglePin(s) { pinned.has(s) ? pinned.delete(s) : pinned.add(s); render(); }
    const bind = (id, vid, key, div) => {
        document.getElementById(id).oninput = (e) => {
            const v = parseFloat(e.target.value); FILTER[key] = v / div;
            document.getElementById(vid).innerText = (key==='VOL'?(v/10).toFixed(1)+'x':v+'%');
        }
    };
    bind('i_slp', 'v_slp', 'SLP', 100); bind('i_drv', 'v_drv', 'DRV', 1); bind('i_vol', 'v_vol', 'VOL', 10);
</script>
</body>
</html>
