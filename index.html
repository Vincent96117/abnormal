<!DOCTYPE html>
<html>
<head>
    <title>⚡ DRIVE SNIPER V5.0 - 莊家發動版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; transition: all 0.3s; }
        .active-launch { border: 2px solid #a855f7 !important; background: #1e1b4b !important; box-shadow: 0 0 20px #6366f1; } /* 紫色：爆發中 */
        .score-val { font-size: 2.2rem; font-weight: 900; line-height: 1; }
        input[type=range] { accent-color: #a855f7; }
    </style>
</head>
<body class="flex overflow-hidden">
    <div class="flex-1 p-5 overflow-y-auto h-screen">
        <div class="control-panel bg-zinc-900 p-5 mb-6 rounded-xl sticky top-0 z-50 border border-purple-500/20 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-black text-purple-500 italic uppercase">⚡ Sniper V5.0 <span class="text-xs text-white bg-purple-900 px-2 py-1 rounded ml-2">Active Launch</span></h1>
                <input type="text" id="searchInput" placeholder="搜尋幣名..." class="bg-black border border-zinc-800 px-4 py-2 rounded-lg text-sm text-purple-400 outline-none w-64">
            </div>
            
            <div class="grid grid-cols-3 gap-8 text-[11px] font-bold">
                <div class="space-y-2">
                    <div class="flex justify-between text-red-500"><span>📉 Slope (資費惡化)</span><span id="slp_val">-5.0%</span></div>
                    <input type="range" id="slp_range" min="-80" max="0" value="-5" class="w-full">
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-yellow-500"><span>💯 Vacuum (真空評分)</span><span id="drv_val">60</span></div>
                    <input type="range" id="drv_range" min="0" max="100" value="60" class="w-full">
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-blue-400"><span>⚡ Vol Multiplier (量能倍數)</span><span id="vol_val">1.2x</span></div>
                    <input type="range" id="vol_range" min="10" max="50" value="12" class="w-full">
                </div>
            </div>
        </div>

        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>

    <script>
        const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT'];
        let stats = {}, FILTER = { SLP: -0.05, DRV_SCORE: 60, VOL_RATIO: 1.2 };

        function calculateScore(d) {
            if (d < 1000) return Math.round((d / 1000) * 20);
            if (d < 5000) return Math.round(20 + ((d - 1000) / 4000) * 40);
            if (d < 15000) return Math.round(60 + ((d - 5000) / 10000) * 30);
            return Math.round(90 + Math.min(10, (d - 15000) / 5000));
        }

        async function update() {
            try {
                const [fRes, oRes] = await Promise.all([
                    fetch('https://fapi.binance.com/fapi/v1/premiumIndex'),
                    fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')
                ]);
                const fData = await fRes.json(), oData = await oRes.json();
                let results = [];
                const keyword = document.getElementById('searchInput').value.toUpperCase();

                fData.filter(c => c.symbol.endsWith('USDT') && !EXCLUDE.includes(c.symbol)).forEach(c => {
                    const s = c.symbol;
                    const ticker = oData.find(t => t.symbol === s);
                    if (!ticker) return;

                    const fNow = parseFloat(c.lastFundingRate), pNow = parseFloat(ticker.lastPrice), vNow = parseFloat(ticker.quoteVolume);
                    
                    if (!stats[s]) { 
                        stats[s] = { p: pNow, v: vNow, vHist: [vNow], frHist: [fNow], drvHist: [] }; 
                        return; 
                    }

                    // 量能倍數計算 (當前量 / 過去均量)
                    stats[s].vHist.push(vNow); if (stats[s].vHist.length > 30) stats[s].vHist.shift();
                    const avgVol = stats[s].vHist.reduce((a,b)=>a+b,0) / stats[s].vHist.length;
                    const volRatio = vNow / (avgVol || 1);

                    // 真空度計算
                    stats[s].frHist.push(fNow); if (stats[s].frHist.length > 30) stats[s].frHist.shift();
                    const slope = (fNow - stats[s].frHist[0]) / Math.abs(stats[s].frHist[0] || 0.0001);
                    const vDelta = Math.abs(vNow - stats[s].v);
                    const pDelta = Math.abs(pNow - stats[s].p) / stats[s].p;
                    const instDrv = vDelta > 0 ? (pDelta / vDelta) * 100000000 : 0; // 調整係數適應大交易對
                    
                    stats[s].drvHist.push(instDrv); if (stats[s].drvHist.length > 30) stats[s].drvHist.shift();
                    const avgDrv = stats[s].drvHist.reduce((a,b)=>a+b,0) / stats[s].drvHist.length;
                    
                    stats[s].p = pNow; stats[s].v = vNow;
                    const score = calculateScore(avgDrv);

                    // 核心門檻：量能 + 真空 + 斜率
                    const isHitting = (slope <= FILTER.SLP && score >= FILTER.DRV_SCORE && volRatio >= FILTER.VOL_RATIO);
                    
                    if (isHitting || (keyword && s.includes(keyword))) {
                        results.push({ s, slope, score, price: pNow, volRatio });
                    }
                });

                const list = document.getElementById('list'); list.innerHTML = '';
                results.sort((a,b) => b.volRatio - a.volRatio).forEach(item => {
                    const isLaunch = item.volRatio > 2.0;
                    const div = document.createElement('div');
                    div.className = `card p-5 rounded-2xl ${isLaunch ? 'active-launch' : ''}`;
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="text-white font-black text-2xl">${item.s.replace('USDT','')}</div>
                                <div class="text-xs ${item.slope < 0 ? 'text-red-500' : 'text-zinc-500'} font-bold">SLOPE: ${(item.slope*100).toFixed(1)}%</div>
                            </div>
                            <div class="text-right">
                                <div class="score-val ${isLaunch ? 'text-purple-400' : 'text-yellow-500'}">${item.score}</div>
                                <div class="text-[9px] text-zinc-500 uppercase font-black">Vacuum Score</div>
                            </div>
                        </div>
                        <div class="mt-4 flex justify-between items-end">
                            <div class="bg-black/50 px-3 py-1 rounded border border-zinc-800">
                                <span class="text-[10px] text-zinc-500 block uppercase font-bold">Vol Boost</span>
                                <span class="text-blue-400 font-black text-lg">${item.volRatio.toFixed(2)}x</span>
                            </div>
                            <div class="text-right text-[10px] text-zinc-600 font-mono">
                                $${item.price}
                            </div>
                        </div>`;
                    list.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        const bindFilter = (id, valId, key, scale) => {
            document.getElementById(id).oninput = (e) => {
                let v = parseFloat(e.target.value);
                FILTER[key] = v / scale;
                document.getElementById(valId).innerText = (key==='VOL_RATIO'?(v/10).toFixed(1)+'x':v+(key==='DRV_SCORE'?'':'%'));
            };
        };
        bindFilter('slp_range', 'slp_val', 'SLP', 100);
        bindFilter('drv_range', 'drv_val', 'DRV_SCORE', 1);
        bindFilter('vol_range', 'vol_val', 'VOL_RATIO', 10);

        setInterval(update, 3000); update();
    </script>
</body>
</html>
