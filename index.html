<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V6.2.8 - LOG FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
        .panel { background: linear-gradient(145deg, #18181b, #09090b); border: 1px solid #27272a; }
        .card { background: #09090b; border: 1px solid #18181b; position: relative; transition: 0.2s; }
        .sniper-trigger { border: 2px solid #ef4444 !important; background: #450a0a !important; animation: blink-red 0.8s infinite; }
        .hunter-trigger { border: 2px solid #facc15 !important; background: #422006 !important; animation: blink-yellow 1s infinite; }
        .fuel-trigger { border: 2px solid #a855f7 !important; background: #1e1b4b !important; }
        .fading { opacity: 0.5; filter: grayscale(0.5); animation: none !important; }
        @keyframes blink-red { 0%, 100% { box-shadow: 0 0 15px #7f1d1d; } 50% { box-shadow: 0 0 5px #7f1d1d; } }
        @keyframes blink-yellow { 0%, 100% { box-shadow: 0 0 12px #713f12; } 50% { box-shadow: 0 0 4px #713f12; } }
        input[type=range] { -webkit-appearance: none; background: #3f3f46; height: 6px; border-radius: 3px; width: 100%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6; }
        /* 日誌美化 */
        #logs::-webkit-scrollbar { width: 4px; }
        #logs::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[11px]">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="panel p-5 rounded-2xl mb-4 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-black italic text-white uppercase tracking-tighter">Sniper Elite V6.2.8</h1>
                <div class="flex gap-3">
                    <button id="fuelBtn" onclick="toggleFuel()" class="bg-zinc-800 border border-zinc-700 px-4 py-1.5 rounded-lg font-black text-purple-400 text-[10px] uppercase transition-all">⚓ Fuel Mode</button>
                    <input type="text" id="search" onkeydown="handleSearch(event)" placeholder="SYMBOL & ENTER" class="bg-black border border-zinc-700 px-3 py-1.5 rounded-lg text-blue-400 outline-none w-40 font-black focus:border-red-500">
                </div>
            </div>

            <div class="grid grid-cols-4 gap-6">
                <div class="space-y-2">
                    <div class="flex justify-between font-black text-red-500"><span>🔴 SNIPER VOL</span><span id="flash_val">20%</span></div>
                    <input type="range" id="flash_range" min="1" max="60" value="20">
                    <p id="flash_h" class="text-[8px] text-zinc-500 italic">目標: 瞬爆快進快出</p>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-black text-yellow-500"><span>🟡 HUNTER SLP</span><span id="slp_val">-2.5%</span></div>
                    <input type="range" id="slp_range" min="-800" max="0" value="-25">
                    <p id="slp_h" class="text-[8px] text-zinc-500 italic">目標: 穩定吃8%大肉</p>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-black text-purple-500"><span>⚓ FUEL</span><span id="fuel_val">15%</span></div>
                    <input type="range" id="fuel_range" min="1" max="60" value="15">
                    <p id="fuel_h" class="text-[8px] text-zinc-500 italic">目標: 埋伏軋空行情</p>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-black text-blue-500"><span>💎 VAC</span><span id="vac_val">120</span></div>
                    <input type="range" id="vac_range" min="10" max="500" value="120">
                    <p id="vac_h" class="text-[8px] text-zinc-500 italic">目標: 真空無壓噴發</p>
                </div>
            </div>
        </div>

        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pr-2"></div>
    </div>

    <div class="w-80 bg-black border-l border-zinc-900 flex flex-col p-4 overflow-hidden">
        <div class="text-zinc-500 font-black text-center mb-4 pb-2 border-b border-zinc-800 uppercase italic tracking-widest text-[10px]">Combat History Log</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-2 flex flex-col-reverse justify-end">
            </div>
        <button onclick="testPush()" class="mt-4 bg-zinc-900 hover:bg-zinc-800 text-zinc-600 py-3 rounded-xl font-black text-[10px] transition-all">TEST CONNECTION</button>
    </div>

<script>
    const P_USER = "Gkhqyhobnxzjfwgvaiyp347m1jkhn4", P_TOKEN = "acyoe3sz15x491r1349fdcau7x6pw";
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    const LOCK_TIME = 180000;
    let stats = {}, pinned = new Set(), keyword = "";
    let SETTINGS = { SLP: -0.025, FLASH: 0.20, FUEL: 0.15, VAC: 120, USE_FUEL: true };

    async function push(t, m) { fetch('https://api.pushover.net/1/messages.json',{method:'POST',body:new URLSearchParams({token:P_TOKEN,user:P_USER,title:t,message:m})}); }
    
    // 修復後的 Log 函數
    function addLog(m, c="text-zinc-600") {
        const l = document.getElementById('logs');
        const d = document.createElement('div');
        d.className = `pl-2 border-l-2 border-zinc-800 py-1.5 ${c} font-bold animate-in fade-in slide-in-from-left-1`;
        d.innerHTML = `<span class="opacity-40 text-[8px]">${new Date().toLocaleTimeString('zh-TW',{hour12:false})}</span><br>${m}`;
        l.prepend(d);
        if(l.children.length > 40) l.lastChild.remove();
    }

    function handleSearch(e) { if(e.key==='Enter') keyword = e.target.value.toUpperCase(); }
    function toggleFuel() { SETTINGS.USE_FUEL=!SETTINGS.USE_FUEL; document.getElementById('fuelBtn').classList.toggle('bg-purple-900'); addLog("Fuel Mode Toggled", "text-purple-400"); }
    function testPush() { push("SNIPER V6.2.8", "日誌修復完畢"); addLog("CONNECTION TEST SUCCESS", "text-blue-400"); }

    async function update() {
        try {
            const [fRes, tRes] = await Promise.all([fetch('https://fapi.binance.com/fapi/v1/premiumIndex'), fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')]);
            const fData = await fRes.json(), tData = await tRes.json();
            const tMap = new Map(tData.map(t=>[t.symbol, t]));

            let results = [];
            fData.forEach(c => {
                const s = c.symbol; if(!s.endsWith('USDT')) return;
                if(EXCLUDE.includes(s) && !s.includes(keyword)) return;

                const ticker = tMap.get(s); if(!ticker) return;
                const pNow = parseFloat(ticker.lastPrice), fNow = parseFloat(c.lastFundingRate);
                const vNow = parseFloat(ticker.quoteVolume), wap = parseFloat(ticker.weightedAvgPrice);

                if(!stats[s]) stats[s]={ lastV:vNow, pHist:[], lastS:0, lastH:0, lastFR:fNow };
                
                // 資費異動 0.05%
                if(Math.abs(fNow - stats[s].lastFR) >= 0.0005) { 
                    push(`資費異動: ${s}`, `FR:${(fNow*100).toFixed(3)}%`); 
                    addLog(`[FR] ${s} 異動至 ${(fNow*100).toFixed(3)}%`, "text-orange-400");
                    stats[s].lastFR = fNow; 
                }

                const vDelta = vNow - stats[s].lastV; stats[s].lastV = vNow;
                stats[s].pHist.push(pNow); if(stats[s].pHist.length>50) stats[s].pHist.shift();
                
                const volSurge = vDelta / ((vNow / 1440) || 1);
                const flash = (pNow - stats[s].pHist[0]) / (parseFloat(ticker.highPrice) - parseFloat(ticker.lowPrice) || 1);
                const distWap = (pNow - wap) / wap;

                const isSNow = (volSurge > 2.5) && (flash >= SETTINGS.FLASH) && (distWap > 0.005);
                const isHNow = (volSurge > 1.5) && (flash >= 0.15) && (pNow > wap);
                const isFNow = SETTINGS.USE_FUEL && (fNow < SETTINGS.SLP) && (Math.abs(distWap) < 0.03);

                if(isSNow) {
                    if(Date.now() - stats[s].lastS > 300000) addLog(`[SNIPER] ${s} 瞬間噴發!`, "text-red-500");
                    stats[s].lastS = Date.now();
                }
                if(isHNow) stats[s].lastH = Date.now();

                const isS = (Date.now() - stats[s].lastS) < LOCK_TIME;
                const isH = (Date.now() - stats[s].lastH) < LOCK_TIME;

                if(isS || isH || isFNow || pinned.has(s) || (keyword && s.includes(keyword))) {
                    results.push({ s, pNow, wap, distWap, isS, isH, isF:isFNow, isSNow, isHNow, sAge:Date.now()-stats[s].lastS, hAge:Date.now()-stats[s].lastH });
                }
            });

            results.sort((a,b) => (b.isS - a.isS) || (b.isH - a.isH) || (b.distWap - a.distWap));
            render(results);
        } catch(e) {}
    }

    function render(data) {
        const l = document.getElementById('list'); l.innerHTML = '';
        data.forEach((item, idx) => {
            let cls = "", label = "READY", age = 0;
            if(item.isS) { cls = "sniper-trigger"; label = "🔴 SNIPER"; age = item.sAge; if(!item.isSNow) cls += " fading"; }
            else if(item.isH) { cls = "hunter-trigger"; label = "🟡 HUNTER"; age = item.hAge; if(!item.isHNow) cls += " fading"; }
            else if(item.isF) { cls = "fuel-trigger"; label = "⚓ FUEL"; }

            const div = document.createElement('div');
            div.className = `card p-5 rounded-2xl ${cls}`;
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-white font-black text-xl italic">${item.s.replace('USDT','')}</div>
                        <div class="text-[10px] font-bold ${item.distWap>0?'text-green-500':'text-red-500'}">GAP: ${(item.distWap*100).toFixed(2)}%</div>
                    </div>
                    <div class="text-right">
                        <div class="text-white font-black text-lg">$${item.pNow.toFixed(item.pNow<1?5:2)}</div>
                        <div class="text-[9px] text-zinc-500 font-bold tracking-tighter italic">WAP: ${item.wap.toFixed(item.wap<1?4:2)}</div>
                    </div>
                </div>
                <div class="mt-4 pt-3 border-t border-white/5 flex justify-between items-center text-[9px] font-black">
                    <span class="text-zinc-600">RANK ${idx+1}</span>
                    <span class="${item.isSNow || item.isHNow ? 'text-white animate-pulse':'text-zinc-500'}">${label} ${age > 0 ? (Math.ceil((LOCK_TIME-age)/1000)+'s') : ''}</span>
                </div>
            `;
            l.appendChild(div);
        });
    }

    setInterval(update, 3000);
    // 滑桿連動說明文字修復
    document.getElementById('flash_range').oninput = function() { SETTINGS.FLASH = this.value/100; document.getElementById('flash_val').innerText = this.value+'%'; updateHint('flash', this.value); }
    document.getElementById('slp_range').oninput = function() { SETTINGS.SLP = this.value/1000; document.getElementById('slp_val').innerText = (this.value/10).toFixed(1)+'%'; updateHint('slp', this.value/10); }
    
    function updateHint(type, val) {
        if(type==='flash') document.getElementById('flash_h').innerText = val < 20 ? "⚠️ [激進] 剛動就亮，適合搶頭" : "🔥 [瞬爆] 垂直噴發，進去就大波動";
        if(type==='slp') document.getElementById('slp_h').innerText = val < -5 ? "❌ [太嚴] 可能會沒訊號" : "📈 [標準] 適合吃8%大肉";
    }
</script>
</body>
</html>
