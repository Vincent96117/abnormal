<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V6.6.0 - FULL DATA RADAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
        .panel { background: #0a0a0a; border-bottom: 2px solid #1a1a1a; position: sticky; top: 0; z-index: 100; }
        .card { background: #09090b; border: 1px solid #18181b; min-height: 140px; transition: all 0.3s; }
        .card-idle { border-color: #064e3b !important; animation: breath 3s infinite ease-in-out; }
        @keyframes breath { 0%, 100% { box-shadow: 0 0 5px #064e3b; } 50% { box-shadow: 0 0 15px #059669; } }
        .card-red { border: 2px solid #ef4444 !important; background: #450a0a !important; animation: blink-red 0.6s infinite !important; }
        @keyframes blink-red { 0%, 100% { box-shadow: 0 0 20px #ef4444; } 50% { box-shadow: 0 0 5px #ef4444; } }
        .card-yellow { border: 2px solid #eab308 !important; background: #422006 !important; }
        .card-purple { border: 2px solid #a855f7 !important; background: #3b0764 !important; }
        #logs::-webkit-scrollbar, .radar-list::-webkit-scrollbar { width: 4px; }
        #logs::-webkit-scrollbar-thumb { background: #27272a; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[11px]">
    <div class="flex-1 flex flex-col overflow-hidden">
        <div class="panel p-5">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-black italic text-white tracking-tighter">V6.6.0 <span class="text-red-600 italic">SNIPER</span></h1>
                <div class="flex gap-4">
                    <button id="fuelBtn" onclick="toggleFuel()" class="bg-zinc-900 border border-zinc-700 px-6 py-2 rounded-xl text-purple-400 font-black text-[10px]">⚓ Fuel Mode</button>
                    <input type="text" id="search" onkeydown="handleSearch(event)" placeholder="SYMBOL & ENTER" class="bg-black border border-zinc-800 px-4 py-2 rounded-xl text-blue-400 outline-none w-48 focus:border-red-600">
                </div>
            </div>
            <div class="grid grid-cols-4 gap-6">
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-white/5 text-center">
                    <div class="text-red-500 text-[10px] mb-1 font-black italic">🔴 FLASH</div><span id="flash_val" class="text-white text-sm font-black">20%</span>
                    <input type="range" id="flash_range" class="w-full mt-2" min="1" max="60" value="20" oninput="updateVal('flash', this.value)">
                </div>
                <div class="bg-zinc-900/50 p-4 rounded-22xl border border-white/5 text-center">
                    <div class="text-yellow-500 text-[10px] mb-1 font-black italic">🟡 SLP</div><span id="slp_val" class="text-white text-sm font-black">-2.5%</span>
                    <input type="range" id="slp_range" class="w-full mt-2" min="-800" max="0" value="-25" oninput="updateVal('slp', this.value)">
                </div>
                <div class="bg-zinc-900/50 p-4 rounded-22xl border border-white/5 text-center">
                    <div class="text-purple-500 text-[10px] mb-1 font-black italic">⚓ FUNDING</div><span id="fuel_val" class="text-white text-sm font-black">0.05%</span>
                    <input type="range" id="fuel_range" class="w-full mt-2" min="1" max="20" value="5" oninput="updateVal('fuel', this.value)">
                </div>
                <div class="bg-zinc-900/50 p-4 rounded-22xl border border-white/5 text-center">
                    <div class="text-blue-500 text-[10px] mb-1 font-black italic">💎 VAC</div><span id="vac_val" class="text-white text-sm font-black">120</span>
                    <input type="range" id="vac_range" class="w-full mt-2" min="10" max="500" value="120" oninput="updateVal('vac', this.value)">
                </div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 p-5 overflow-y-auto"></div>
    </div>

    <div class="w-[520px] bg-black border-l border-zinc-900 flex flex-col shadow-2xl">
        <div class="flex flex-1 overflow-hidden">
            <div class="flex-1 border-r border-zinc-900 p-3 overflow-y-auto radar-list">
                <div class="text-red-500 font-black text-[10px] mb-3 italic uppercase tracking-tighter border-b border-red-900/30 pb-1">🚀 領航強勢 (Top 10)</div>
                <div id="strong-list" class="space-y-3"></div>
            </div>
            <div class="flex-1 p-3 overflow-y-auto radar-list">
                <div class="text-blue-400 font-black text-[10px] mb-3 italic uppercase tracking-tighter border-b border-blue-900/30 pb-1">📡 蓄勢候補 (Top 10)</div>
                <div id="backup-list" class="space-y-3"></div>
            </div>
        </div>
        <div class="h-48 border-t border-zinc-900 p-4 bg-zinc-950/80">
            <div class="text-zinc-500 font-bold text-[9px] uppercase mb-2 italic flex justify-between">
                <span>Intercept Log</span><span class="text-green-900 font-black">V6.6.0 STABLE</span>
            </div>
            <div id="logs" class="overflow-y-auto h-32 space-y-1 text-[9px]"></div>
        </div>
    </div>

<script>
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    const LOCK_TIME = 180000;
    let stats = {}, pinned = new Set(), baselineData = {};
    let SETTINGS = { SLP: -0.025, FLASH: 0.20, FUEL: -0.0005, VAC: 120, USE_FUEL: true };

    function updateVal(key, val) {
        if(key === 'flash') SETTINGS.FLASH = val/100; 
        if(key === 'slp') SETTINGS.SLP = val/1000;
        if(key === 'fuel') SETTINGS.FUEL = -(val/10000);
        document.getElementById(key+'_val').innerText = (key==='slp'?(val/10)+'%':(key==='fuel'?(val/100)+'%':val));
    }

    async function fetchSymbolBaselines(s) {
        try {
            const [k, h] = await Promise.all([
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${s}&interval=1d&limit=5`).then(r=>r.json()),
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${s}&interval=1h&limit=120`).then(r=>r.json())
            ]);
            let tV=0, tQ=0, tA=0; k.forEach(v=>{ tA+=(v[2]-v[3])/v[1]; tV+=parseFloat(v[5]); tQ+=parseFloat(v[7]); });
            baselineData[s] = { avgAmp: tA/5, wap5d: tQ/tV, avgTradesHr: h.reduce((a,c)=>a+parseInt(c[8]),0)/120 };
        } catch(e) {}
    }

    async function initBaselines() {
        const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
        const data = await res.json();
        const targets = data.filter(s => s.symbol.endsWith('USDT') && !EXCLUDE.includes(s.symbol)).sort((a,b)=>b.quoteVolume-a.quoteVolume).slice(0, 200);
        for(let i=0; i<targets.length; i+=10) { await Promise.all(targets.slice(i, i+10).map(s => fetchSymbolBaselines(s.symbol))); }
    }

    function addLog(s, msg) {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = "text-zinc-500 pb-1 border-b border-zinc-900";
        div.innerHTML = `[${new Date().toLocaleTimeString([], {hour12:false})}] <span class="text-red-500 font-bold">${s}</span> ${msg}`;
        logs.prepend(div); if(logs.children.length > 50) logs.lastChild.remove();
    }

    async function update() {
        try {
            const [fRes, tRes] = await Promise.all([fetch('https://fapi.binance.com/fapi/v1/premiumIndex'), fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')]);
            const fData = await fRes.json(), tData = await tRes.json(), tMap = new Map(tData.map(t=>[t.symbol,t]));
            let sniperResults = [], strongPool = [], backupPool = [];
            const now = Date.now();

            fData.forEach(c => {
                const s = c.symbol; if(!s.endsWith('USDT') || (EXCLUDE.includes(s) && !pinned.has(s))) return;
                const t = tMap.get(s); if(!t) return;
                const pNow = parseFloat(t.lastPrice), trades = parseInt(t.count), funding = parseFloat(c.lastFundingRate);
                
                if(!stats[s]) stats[s]={ lastV:parseFloat(t.quoteVolume), vDeltas:[], pHist:[], lastS:0, hourStart: new Date().setMinutes(0,0,0), startTrades: trades, highP: pNow };
                const vDelta = Math.max(0, parseFloat(t.quoteVolume) - stats[s].lastV); stats[s].lastV = parseFloat(t.quoteVolume);
                stats[s].pHist.push(pNow); if(stats[s].pHist.length>50) stats[s].pHist.shift();
                if(pNow > stats[s].highP) stats[s].highP = pNow;
                
                const slp = (pNow - stats[s].highP)/stats[s].highP;
                const distWap = (pNow - parseFloat(t.weightedAvgPrice))/parseFloat(t.weightedAvgPrice);
                const flash = (pNow - stats[s].pHist[0])/(parseFloat(t.highPrice) - parseFloat(t.lowPrice) || 0.001);
                
                let color = 'idle';
                if(vDelta > (Math.max(...stats[s].vDeltas||[0])*1.1) && flash >= SETTINGS.FLASH && distWap > 0.003) color = 'red';
                else if(slp <= SETTINGS.SLP) color = 'yellow';
                else if(SETTINGS.USE_FUEL && funding <= SETTINGS.FUEL) color = 'purple';

                if(color === 'red' && (now - stats[s].lastS) > 60000) { stats[s].lastS = now; addLog(s.replace('USDT',''), "SNIPER TRIGGER"); }
                if((now-stats[s].lastS)<LOCK_TIME || pinned.has(s)) { sniperResults.push({ s, pNow, distWap, color }); }
                stats[s].vDeltas.push(vDelta); if(stats[s].vDeltas.length>300) stats[s].vDeltas.shift();

                if(baselineData[s]) {
                    const vScore = ((parseFloat(t.highPrice)-parseFloat(t.lowPrice))/parseFloat(t.openPrice)) / (baselineData[s].avgAmp || 1);
                    const hScore = ((trades - stats[s].startTrades)*(60/Math.max(1,(now-stats[s].hourStart)/60000))) / (baselineData[s].avgTradesHr || 1);
                    const wapGap = ((pNow / baselineData[s].wap5d) - 1)*100;
                    const item = { s, pNow, wapGap, hScore, vScore, wap5d: baselineData[s].wap5d, score: (vScore * 0.5 + hScore * 0.5) };
                    if (pNow > baselineData[s].wap5d && vScore > 1.1) strongPool.push(item); else backupPool.push(item);
                }
            });

            strongPool.sort((a,b)=>b.score - a.score);
            backupPool.sort((a,b)=>b.score - a.score);
            renderRadar(strongPool.slice(0,10), 'strong-list', true);
            renderRadar(backupPool.slice(0,10), 'backup-list', false);
            renderCards(sniperResults);
        } catch(e){}
    }

    function renderRadar(items, elementId, isStrong) {
        const l = document.getElementById(elementId); l.innerHTML = '';
        items.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = "bg-zinc-900/40 p-3 rounded-xl border border-white/5 space-y-1";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="font-black text-white ${isStrong?'text-[11px]':'text-[10px]'}">${isStrong?(idx+1)+'. ':''}${item.s.replace('USDT','')}</span>
                    <span class="text-zinc-400 font-bold">$${item.pNow.toFixed(item.pNow<1?4:2)}</span>
                </div>
                <div class="flex justify-between text-[9px]">
                    <span class="text-zinc-500">5D-WAP: $${item.wap5d.toFixed(item.wap5d<1?4:2)}</span>
                    <span class="${item.wapGap>0?'text-green-500':'text-red-500'} font-black">${item.wapGap>0?'+':''}${item.wapGap.toFixed(2)}%</span>
                </div>
                <div class="flex justify-between text-[8px] font-bold uppercase">
                    <span class="text-pink-500">💓 SPEED: ${item.hScore.toFixed(1)}X</span>
                    <span class="text-blue-400">🌊 VOLAT: ${item.vScore.toFixed(1)}X</span>
                </div>`;
            l.appendChild(div);
        });
    }

    function renderCards(data) {
        const l = document.getElementById('list'); l.innerHTML = '';
        data.forEach(i => {
            const d = document.createElement('div'); d.className = `card p-5 rounded-22xl card-${i.color}`;
            d.innerHTML = `<div class="flex justify-between"><div><div class="text-white font-black text-xl italic">${i.s.replace('USDT','')}</div><div class="text-green-500 font-bold mt-1">GAP: ${(i.distWap*100).toFixed(2)}%</div></div><div class="text-white font-black text-lg">$${i.pNow.toFixed(i.pNow<1?4:2)}</div></div>`;
            l.appendChild(d);
        });
    }

    async function handleSearch(e){ 
        if(e.key==='Enter'){ 
            let k = e.target.value.toUpperCase(); if(!k) return;
            if(!k.endsWith('USDT')) k += 'USDT';
            await fetchSymbolBaselines(k); pinned.add(k); e.target.value='';
        }
    }
    
    function toggleFuel(){ SETTINGS.USE_FUEL=!SETTINGS.USE_FUEL; document.getElementById('fuelBtn').classList.toggle('active-fuel'); }
    initBaselines(); setInterval(update, 3000);
</script>
</body>
</html>
