<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V5.4.1 - FULL SPECS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; cursor: pointer; transition: all 0.2s; }
        .hunt-trigger { border: 2px solid #a855f7 !important; background: #1e1b4b !important; animation: blink 0.8s infinite; }
        .pinned { border: 2px solid #3b82f6 !important; background: #081221 !important; }
        .funding-danger { border: 2px solid #ef4444 !important; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .score-val { font-weight: 900; color: #eab308; line-height: 1; }
        .toggle-active { background: #ef4444 !important; color: white !important; box-shadow: 0 0 15px #ef4444; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[11px]">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="bg-zinc-900 p-4 rounded-xl mb-4 border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col">
                    <h1 class="text-xl font-black text-blue-500 italic uppercase">⚡ Sniper V5.4.1</h1>
                    <div id="status" class="text-[9px] text-zinc-500 font-bold mt-1 uppercase tracking-widest">System Monitoring</div>
                </div>
                <div class="flex gap-3">
                    <button id="breakoutToggle" onclick="toggleBreakout()" class="bg-black border border-zinc-700 px-4 py-2 rounded-lg font-black text-zinc-400 uppercase">⚡ Breakout</button>
                    <input type="text" id="searchInput" placeholder="SEARCH..." class="bg-black border border-zinc-800 px-3 py-1 rounded text-blue-400 outline-none w-32 uppercase">
                </div>
            </div>
            <div class="grid grid-cols-3 gap-6 font-black uppercase">
                <div class="space-y-1">
                    <div class="flex justify-between text-red-500"><span>📉 Slope</span><span id="slp_val">-5%</span></div>
                    <input type="range" id="slp_range" min="-80" max="0" value="-5" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-yellow-500"><span>💯 Vacuum</span><span id="drv_val">90</span></div>
                    <input type="range" id="drv_range" min="0" max="100" value="90" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-blue-400"><span>⚡ Vol Boost</span><span id="vol_val">1.2x</span></div>
                    <input type="range" id="vol_range" min="10" max="50" value="12" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pr-2"></div>
    </div>
    <div class="w-72 bg-zinc-950 border-l border-zinc-900 flex flex-col p-4 font-mono text-[10px]">
        <div class="text-zinc-600 font-black mb-4 border-b border-zinc-800 pb-2 uppercase tracking-tighter">System Logs</div>
        <div id="logs" class="flex-1 overflow-y-auto space-y-2"></div>
    </div>

<script>
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    const MEMORY_TIME = 30000; // 鎖定 30 秒
    let stats = {}, pinned = new Set(), FILTER = { SLP: -0.05, DRV_SCORE: 90, VOL_RATIO: 1.2 };
    let IS_BREAKOUT_ONLY = false, isUpdating = false;

    function toggleBreakout() {
        IS_BREAKOUT_ONLY = !IS_BREAKOUT_ONLY;
        document.getElementById('breakoutToggle').classList.toggle('toggle-active');
    }

    function addLog(msg, color="text-zinc-500") {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = `border-l-2 border-zinc-800 pl-2 py-1 ${color}`;
        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logs.prepend(div);
        if (logs.children.length > 50) logs.lastChild.remove();
    }

    function calculateScore(d) {
        if (d < 1000) return Math.round((d / 1000) * 20);
        if (d < 5000) return Math.round(20 + ((d - 1000) / 4000) * 40);
        if (d < 15000) return Math.round(60 + ((d - 5000) / 10000) * 30);
        return Math.round(90 + Math.min(10, (d - 15000) / 5000));
    }

    async function update() {
        if (isUpdating) return;
        isUpdating = true;
        try {
            const fRes = await fetch('https://fapi.binance.com/fapi/v1/premiumIndex');
            const fData = await fRes.json();
            const tRes = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
            const tData = await tRes.json();

            const tMap = new Map(tData.map(t => [t.symbol, t]));
            let results = [];
            const keyword = document.getElementById('searchInput').value.toUpperCase();
            const now = Date.now();

            fData.forEach(c => {
                const s = c.symbol;
                if (!s.endsWith('USDT') || EXCLUDE.includes(s)) return;
                
                const ticker = tMap.get(s);
                if (!ticker) return;

                const fNow = parseFloat(c.lastFundingRate), pNow = parseFloat(ticker.lastPrice), vNow = parseFloat(ticker.quoteVolume);
                const zonePrice = (parseFloat(ticker.highPrice) + parseFloat(ticker.lowPrice)) / 2;

                if (!stats[s]) { 
                    stats[s] = { p: pNow, v: vNow, vHist: [], frHist: [], drvHist: [], lastTrigger: 0, lastDanger: 0 }; 
                    return; 
                }

                stats[s].vHist.push(vNow); if (stats[s].vHist.length > 12) stats[s].vHist.shift(); 
                stats[s].frHist.push(fNow); if (stats[s].frHist.length > 12) stats[s].frHist.shift();
                
                if (stats[s].frHist.length < 12) return;

                const avgVol = stats[s].vHist.reduce((a,b)=>a+b,0) / stats[s].vHist.length;
                const volRatio = vNow / (avgVol || 1);
                const slope = (fNow - stats[s].frHist[0]) / Math.abs(stats[s].frHist[0] || 0.0001);
                
                const vDelta = Math.abs(vNow - stats[s].v);
                const pDelta = Math.abs(pNow - stats[s].p) / stats[s].p;
                const instDrv = vDelta > 0 ? (pDelta / vDelta) * 100000000 : 0;
                stats[s].drvHist.push(instDrv); if (stats[s].drvHist.length > 12) stats[s].drvHist.shift();
                const avgDrv = stats[s].drvHist.reduce((a,b)=>a+b,0) / stats[s].drvHist.length;
                
                const filterScore = calculateScore(avgDrv);

                // --- 核心記憶與過濾邏輯 ---
                const isTriggeredNow = (slope <= FILTER.SLP && filterScore >= FILTER.DRV_SCORE && volRatio >= FILTER.VOL_RATIO);
                const isDangerNow = Math.abs(fNow) >= 0.0005 && filterScore > 40;

                if (isTriggeredNow) stats[s].lastTrigger = now;
                if (isDangerNow) stats[s].lastDanger = now;

                const isTriggeredMem = (now - stats[s].lastTrigger < MEMORY_TIME);
                const isDangerMem = (now - stats[s].lastDanger < MEMORY_TIME);
                const isBreakingOut = pNow > zonePrice;

                // 決定是否顯示：1.觸發中 2.釘選中 3.搜尋中 4.資費警示中
                let shouldShow = isTriggeredMem || pinned.has(s) || (keyword && s.includes(keyword)) || isDangerMem;
                if (IS_BREAKOUT_ONLY && !isBreakingOut && !pinned.has(s)) shouldShow = false;

                if (shouldShow) {
                    results.push({ s, slope, fNow, volRatio, filterScore, rawValue: Math.round(avgDrv), livePrice: pNow, zonePrice, isTriggered: isTriggeredMem, isFundingDanger: isDangerMem, isBreakingOut });
                }

                if (isTriggeredNow && !stats[s].logged) {
                    addLog(`🔥 爆發狙擊: ${s.replace('USDT','')}`, "text-purple-400 font-black");
                    stats[s].logged = true;
                } else if (!isTriggeredNow) { stats[s].logged = false; }

                stats[s].p = pNow; stats[s].v = vNow;
            });

            document.getElementById('status').innerText = `Scanned ${fData.length} Coins | Buffer: 30s`;
            render(results);
        } catch (e) { addLog("❌ 連線中斷", "text-red-500 font-black"); }
        isUpdating = false;
    }

    function render(results) {
        const list = document.getElementById('list'); list.innerHTML = '';
        results.sort((a,b) => {
            const rankA = (a.isTriggered ? 3 : (pinned.has(a.s) ? 2 : (a.isFundingDanger ? 1 : 0)));
            const rankB = (b.isTriggered ? 3 : (pinned.has(b.s) ? 2 : (b.isFundingDanger ? 1 : 0)));
            if (rankA !== rankB) return rankB - rankA;
            return Math.abs(b.fNow) - Math.abs(a.fNow);
        });

        results.slice(0, 24).forEach(item => {
            const div = document.createElement('div');
            div.className = `card p-4 rounded-xl ${item.isTriggered ? 'hunt-trigger' : (pinned.has(item.s) ? 'pinned' : '')} ${item.isFundingDanger ? 'funding-danger' : ''}`;
            div.onclick = () => { pinned.has(item.s) ? pinned.delete(item.s) : pinned.add(item.s); };
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <div class="text-white font-black text-xl italic">${pinned.has(item.s) ? '📌' : ''} ${item.s.replace('USDT','')}</div>
                        <div class="text-[10px] ${item.slope < 0 ? 'text-red-500' : 'text-zinc-500'} font-bold">SLP: ${(item.slope*100).toFixed(1)}% | FR: ${(item.fNow*100).toFixed(3)}%</div>
                        <div class="mt-2 space-y-0.5">
                            <div class="text-[11px] text-blue-400 font-black">PRICE: ${item.livePrice.toFixed(4)}</div>
                            <div class="text-[9px] text-zinc-500 font-bold uppercase tracking-tighter">Zone: ${item.zonePrice.toFixed(4)} ${item.isBreakingOut ? '<span class="text-green-500">▲</span>' : '<span class="text-red-500">▼</span>'}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-yellow-500 font-black text-[10px]">SCORE: ${item.filterScore}</div>
                        <div class="score-val text-xl tracking-tighter">${item.rawValue.toLocaleString()}</div>
                    </div>
                </div>
                <div class="mt-3 flex items-center space-x-2">
                    <div class="flex-1 bg-zinc-900 h-1 rounded-full overflow-hidden">
                        <div class="h-full bg-blue-500 shadow-[0_0_8px_#3b82f6]" style="width: ${Math.min(100, item.volRatio * 20)}%"></div>
                    </div>
                    <span class="text-blue-400 font-black text-[10px]">${item.volRatio.toFixed(1)}x</span>
                </div>`;
            list.appendChild(div);
        });
    }

    const bindFilter = (id, valId, key, scale) => {
        document.getElementById(id).oninput = (e) => {
            let v = parseFloat(e.target.value);
            FILTER[key] = v / scale;
            document.getElementById(valId).innerText = (key==='VOL_RATIO'?(v/10).toFixed(1)+'x':v+(key==='DRV_SCORE'?'':'%'));
        };
    };
    bindFilter('slp_range', 'slp_val', 'SLP', 100);
    bindFilter('drv_range', 'drv_val', 'DRV_SCORE', 1);
    bindFilter('vol_range', 'vol_val', 'VOL_RATIO', 10);

    setInterval(update, 3000); 
    update();
</script>
</body>
</html>
