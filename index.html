<!DOCTYPE html>
<html>
<head>
    <title>⚡ DRIVE V1.1 - 趨勢偵測版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; transition: all 0.3s; position: relative; overflow: hidden; }
        .card:hover { border-color: #0f0; }
        .drive-bar { position: absolute; bottom: 0; left: 0; height: 4px; background: #0f0; transition: width 0.5s; }
        input { background: #111 !important; border: 1px solid #333 !important; color: #0f0 !important; }
        input:focus { border-color: #0f0 !important; outline: none; }
    </style>
</head>
<body class="p-5">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center border-b border-green-900 pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-green-500 italic">⚡ DRIVE TREND</h1>
                <p class="text-[10px] text-gray-500">監控「一段時間內」持續輕量的標的</p>
            </div>
            <div class="flex gap-4 items-center">
                <input type="text" id="searchInput" placeholder="搜尋幣名 (如: B2, GALA)..." class="px-3 py-1 rounded text-sm w-64">
                <div id="status" class="text-[10px] text-gray-400 font-mono">系統掃描中...</div>
            </div>
        </div>

        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            </div>
    </div>

    <script>
        const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT'];
        let stats = {};
        let searchKeyword = "";

        // 搜尋功能
        document.getElementById('searchInput').oninput = (e) => {
            searchKeyword = e.target.value.toUpperCase();
        };

        async function update() {
            try {
                const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
                const data = await res.json();
                const list = document.getElementById('list');
                const results = [];

                data.forEach(c => {
                    const s = c.symbol;
                    if (!s.endsWith('USDT') || EXCLUDE.includes(s)) return;
                    if (searchKeyword && !s.includes(searchKeyword)) return;

                    const price = parseFloat(c.lastPrice);
                    const vol = parseFloat(c.quoteVolume);
                    
                    if (!stats[s]) {
                        stats[s] = { p: price, v: vol, history: [] };
                        return;
                    }

                    const pMove = Math.abs((price - stats[s].p) / stats[s].p) * 100;
                    const vMove = Math.abs((vol - stats[s].v) / stats[s].v) * 100;
                    const instantDrive = vMove > 0 ? (pMove / (vMove + 0.00001)) * 100 : 0;

                    // 🏮 核心進化：存入歷史紀錄 (取最近 50 次，約 2-3 分鐘)
                    stats[s].history.push(instantDrive);
                    if (stats[s].history.length > 50) stats[s].history.shift();

                    // 計算平均 Drive (這就是「一段時間」的推動力)
                    const avgDrive = stats[s].history.reduce((a, b) => a + b, 0) / stats[s].history.length;

                    stats[s].p = price;
                    stats[s].v = vol;

                    // 篩選：只顯示平均 Drive 夠高的活幣
                    if (vol > 10000000 && avgDrive > 10) {
                        results.push({ s, pMove, avgDrive, price });
                    }
                });

                // 按「平均推動力」排序
                results.sort((a, b) => b.avgDrive - a.avgDrive);

                list.innerHTML = '';
                results.slice(0, 16).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'card p-4 rounded-lg';
                    // 根據平均推動力決定顏色
                    const colorClass = item.avgDrive > 1000 ? 'text-yellow-400' : 'text-green-500';
                    
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xl font-bold text-white">${item.s.replace('USDT','')}</span>
                            <span class="text-[10px] text-gray-500">歷史均值</span>
                        </div>
                        <div class="space-y-1 text-sm">
                            <div class="flex justify-between">
                                <span class="text-gray-400 text-xs">當前價:</span>
                                <span class="text-white font-mono">${item.price.toFixed(4)}</span>
                            </div>
                            <div class="mt-3">
                                <div class="text-gray-500 text-[10px] mb-1 uppercase tracking-widest">平均推動效率 (Trend)</div>
                                <div class="text-3xl font-black ${colorClass}">
                                    ${item.avgDrive.toFixed(0)}
                                </div>
                            </div>
                        </div>
                        <div class="drive-bar" style="width: ${Math.min(item.avgDrive/10, 100)}%"></div>
                    `;
                    list.appendChild(div);
                });
                document.getElementById('status').innerText = `LAST UPDATE: ${new Date().toLocaleTimeString()}`;
            } catch (e) { console.error(e); }
        }

        setInterval(update, 3000);
        update();
    </script>
</body>
</html>
