<!DOCTYPE html>
<html>
<head>
    <title>⚡ DRIVE V1.2 - 釘選監控版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; transition: all 0.3s; position: relative; }
        .pinned-card { border: 2px solid #00ff00 !important; background: #0f1a0f !important; z-index: 10; }
        .drive-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: #0f0; transition: width 0.5s; }
        input { background: #111 !important; border: 1px solid #333 !important; color: #0f0 !important; }
        .pin-btn { cursor: pointer; padding: 2px 5px; border-radius: 3px; font-size: 12px; transition: 0.2s; }
        .pin-btn:hover { background: #0f0; color: #000; }
    </style>
</head>
<body class="p-5">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center border-b border-green-900 pb-4 mb-6 text-white">
            <div>
                <h1 class="text-2xl font-bold text-green-500 italic">⚡ DRIVE TREND V1.2</h1>
                <p class="text-[10px] text-gray-500">📌 點擊圖示釘選，鎖定你的目標標的</p>
            </div>
            <div class="flex gap-4 items-center text-white">
                <input type="text" id="searchInput" placeholder="搜尋幣名..." class="px-3 py-1 rounded text-sm w-64">
                <div id="status" class="text-[10px] text-gray-400 font-mono">系統掃描中...</div>
            </div>
        </div>

        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            </div>
    </div>

    <script>
        const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT'];
        let stats = {};
        let searchKeyword = "";
        let pinnedList = JSON.parse(localStorage.getItem('drive_pinned')) || [];

        document.getElementById('searchInput').oninput = (e) => { searchKeyword = e.target.value.toUpperCase(); };

        // 釘選切換
        window.togglePin = (s) => {
            if (pinnedList.includes(s)) {
                pinnedList = pinnedList.filter(item => item !== s);
            } else {
                pinnedList.push(s);
            }
            localStorage.setItem('drive_pinned', JSON.stringify(pinnedList));
            update(); // 立即重新渲染
        };

        async function update() {
            try {
                const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
                const data = await res.json();
                const list = document.getElementById('list');
                
                let results = [];
                data.forEach(c => {
                    const s = c.symbol;
                    if (!s.endsWith('USDT') || EXCLUDE.includes(s)) return;
                    if (searchKeyword && !s.includes(searchKeyword)) return;

                    const price = parseFloat(c.lastPrice);
                    const vol = parseFloat(c.quoteVolume);
                    
                    if (!stats[s]) {
                        stats[s] = { p: price, v: vol, history: [] };
                        return;
                    }

                    const pMove = Math.abs((price - stats[s].p) / stats[s].p) * 100;
                    const vMove = Math.abs((vol - stats[s].v) / stats[s].v) * 100;
                    const instantDrive = vMove > 0 ? (pMove / (vMove + 0.00001)) * 100 : 0;

                    stats[s].history.push(instantDrive);
                    if (stats[s].history.length > 50) stats[s].history.shift();
                    const avgDrive = stats[s].history.reduce((a, b) => a + b, 0) / stats[s].history.length;

                    stats[s].p = price;
                    stats[s].v = vol;

                    results.push({ s, avgDrive, price, vol, isPinned: pinnedList.includes(s) });
                });

                // 排序邏輯：釘選優先，其餘按 avgDrive 排序
                results.sort((a, b) => {
                    if (a.isPinned && !b.isPinned) return -1;
                    if (!a.isPinned && b.isPinned) return 1;
                    return b.avgDrive - a.avgDrive;
                });

                list.innerHTML = '';
                results.filter(i => i.isPinned || (i.vol > 10000000 && i.avgDrive > 5)).slice(0, 20).forEach(item => {
                    const div = document.createElement('div');
                    div.className = `card p-4 rounded-lg ${item.isPinned ? 'pinned-card' : ''}`;
                    const driveVal = item.avgDrive > 1000000 ? 'MAX' : item.avgDrive.toFixed(0);
                    
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xl font-bold text-white">${item.s.replace('USDT','')}</span>
                            <div class="flex gap-2">
                                <span class="pin-btn text-gray-500" onclick="togglePin('${item.s}')">${item.isPinned ? '📍' : '📌'}</span>
                            </div>
                        </div>
                        <div class="space-y-1 text-sm">
                            <div class="flex justify-between font-mono">
                                <span class="text-gray-400 text-xs">PRICE:</span>
                                <span class="text-white">${item.price.toFixed(4)}</span>
                            </div>
                            <div class="mt-3">
                                <div class="text-gray-500 text-[10px] mb-1 uppercase tracking-tighter">AVG DRIVE (2.5M)</div>
                                <div class="text-3xl font-black ${item.avgDrive > 50000 ? 'text-yellow-400' : 'text-green-500'}">
                                    ${driveVal}
                                </div>
                            </div>
                        </div>
                        <div class="drive-bar" style="width: ${Math.min(item.avgDrive/500, 100)}%"></div>
                    `;
                    list.appendChild(div);
                });
                document.getElementById('status').innerText = `UPDATE: ${new Date().toLocaleTimeString()}`;
            } catch (e) { console.error(e); }
        }

        setInterval(update, 3000);
        update();
    </script>
</body>
</html>
