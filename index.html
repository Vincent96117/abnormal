<!DOCTYPE html>
<html>
<head>
    <title>⚡ SNIPER V6.6.0 - DATA HEADERS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
        .panel { background: #0a0a0a; border-bottom: 2px solid #1a1a1a; position: sticky; top: 0; z-index: 100; }
        .card { background: #09090b; border: 1px solid #18181b; min-height: 140px; }
        .sniper-trigger { border: 2px solid #ef4444 !important; background: #450a0a !important; animation: blink-red 0.6s infinite !important; }
        @keyframes blink-red { 0%, 100% { box-shadow: 0 0 20px #7f1d1d; } 50% { box-shadow: 0 0 5px #7f1d1d; } }
        .active-fuel { background: #a855f7 !important; color: white !important; }
        .data-header { font-size: 16px; font-weight: 900; line-height: 1; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[11px]">
    <div class="flex-1 flex flex-col overflow-hidden">
        <div class="panel p-5">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-black italic text-white tracking-tighter uppercase">V6.6.0 <span class="text-red-600">Head-Data</span></h1>
                <div class="flex gap-4">
                    <button id="fuelBtn" onclick="toggleFuel()" class="bg-zinc-900 border border-zinc-700 px-6 py-2 rounded-xl text-purple-400 font-black text-[10px]">⚓ Fuel Mode</button>
                    <input type="text" id="search" onkeydown="handleSearch(event)" placeholder="SEARCH SYMBOL" class="bg-black border border-zinc-800 px-4 py-2 rounded-xl text-blue-400 outline-none w-48 focus:border-red-600">
                </div>
            </div>
            <div class="grid grid-cols-4 gap-6">
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-white/5 text-center">
                    <div class="text-red-500 text-[10px] mb-1 font-bold">🔴 FLASH</div><span id="flash_val" class="text-white text-sm font-black">20%</span>
                    <input type="range" id="flash_range" class="w-full mt-2" min="1" max="60" value="20" oninput="updateVal('flash', this.value)">
                </div>
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-white/5 text-center">
                    <div class="text-yellow-500 text-[10px] mb-1 font-bold">🟡 SLP</div><span id="slp_val" class="text-white text-sm font-black">-2.5%</span>
                    <input type="range" id="slp_range" class="w-full mt-2" min="-800" max="0" value="-25" oninput="updateVal('slp', this.value)">
                </div>
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-white/5 text-center">
                    <div class="text-purple-500 text-[10px] mb-1 font-bold">⚓ FUEL</div><span id="fuel_val" class="text-white text-sm font-black">10%</span>
                    <input type="range" id="fuel_range" class="w-full mt-2" min="1" max="60" value="10" oninput="updateVal('fuel', this.value)">
                </div>
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-white/5 text-center">
                    <div class="text-blue-500 text-[10px] mb-1 font-bold">💎 VAC</div><span id="vac_val" class="text-white text-sm font-black">120</span>
                    <input type="range" id="vac_range" class="w-full mt-2" min="10" max="500" value="120" oninput="updateVal('vac', this.value)">
                </div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 p-5 overflow-y-auto"></div>
    </div>

    <div class="w-80 bg-black border-l border-zinc-900 flex flex-col">
        <div class="p-4 border-b border-zinc-900">
            <div class="text-zinc-500 font-black text-[10px] mb-3 italic tracking-tighter uppercase">🔥 核心動能榜 (TOP 10)</div>
            <div id="potential-list" class="space-y-2 overflow-y-auto h-[70vh] pr-1"></div>
        </div>
        <div class="p-4 flex-1 overflow-hidden">
            <div id="logs" class="space-y-1 text-[9px] overflow-y-auto h-full pr-1"></div>
        </div>
    </div>

<script>
    const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
    let stats = {}, pinned = new Set(), baselineData = {}, activeSymbols = new Set();
    let SETTINGS = { SLP: -0.025, FLASH: 0.20, FUEL: 0.10, VAC: 120, USE_FUEL: true };

    function updateVal(key, val) {
        if(key === 'flash') SETTINGS.FLASH = val/100; 
        if(key === 'slp') SETTINGS.SLP = val/1000;
        document.getElementById(key+'_val').innerText = (key==='slp'?(val/10)+'%':val+'%');
    }

    async function refreshActiveList() {
        try {
            const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
            const data = await res.json();
            activeSymbols = new Set(data.symbols.filter(s => s.status === 'TRADING' && s.quoteAsset === 'USDT').map(s => s.symbol));
        } catch(e) {}
    }

    async function getBaselines(s) {
        if (baselineData[s]) return;
        try {
            const [k, h] = await Promise.all([
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${s}&interval=1d&limit=5`).then(r=>r.json()),
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${s}&interval=1h&limit=120`).then(r=>r.json())
            ]);
            let tV=0, tQ=0, tA=0; k.forEach(v=>{ tA+=(parseFloat(v[2])-parseFloat(v[3]))/parseFloat(v[1]); tV+=parseFloat(v[5]); tQ+=parseFloat(v[7]); });
            baselineData[s] = { avgAmp: tA/5, wap5d: tQ/tV, avgTradesHr: h.reduce((a,c)=>a+parseInt(c[8]),0)/120 };
        } catch(e) {}
    }

    function addLog(s, msg) {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = "bg-zinc-900/40 p-2 rounded border-l border-red-500 text-zinc-500 text-[8px]";
        div.innerHTML = `<span class="text-white font-bold">${s}</span> ${msg}`;
        logs.prepend(div); if(logs.children.length > 20) logs.lastChild.remove();
    }

    async function update() {
        try {
            const [fRes, tRes] = await Promise.all([fetch('https://fapi.binance.com/fapi/v1/premiumIndex'), fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')]);
            const fData = await fRes.json(), tData = await tRes.json(), tMap = new Map(tData.map(t=>[t.symbol,t]));
            let sniperResults = [], allPool = [];
            const now = Date.now();

            for (const c of fData) {
                const s = c.symbol; if(!activeSymbols.has(s) || EXCLUDE.includes(s)) continue;
                const t = tMap.get(s); if(!t) continue;
                const pNow = parseFloat(t.lastPrice);
                
                if(!stats[s]) stats[s]={ lastV:parseFloat(t.quoteVolume), vDeltas:[], pHist:[], lastS:0, hourStart: new Date().setMinutes(0,0,0), startTrades: parseInt(t.count) };
                const vDelta = Math.max(0, parseFloat(t.quoteVolume) - stats[s].lastV); stats[s].lastV = parseFloat(t.quoteVolume);
                stats[s].pHist.push(pNow); if(stats[s].pHist.length>50) stats[s].pHist.shift();
                
                const wap = parseFloat(t.weightedAvgPrice);
                const distWap = (pNow - wap)/wap;
                const flash = (pNow - stats[s].pHist[0])/(parseFloat(t.highPrice) - parseFloat(t.lowPrice) || 0.001);

                if(vDelta > (Math.max(...stats[s].vDeltas||[0])*1.1) && flash >= SETTINGS.FLASH && distWap > 0.003) {
                    if((now - stats[s].lastS) > 60000) { stats[s].lastS = now; addLog(s.replace('USDT',''), "SNIPER!"); }
                }
                if(stats[s].vDeltas) { stats[s].vDeltas.push(vDelta); if(stats[s].vDeltas.length>100) stats[s].vDeltas.shift(); }

                if((now-stats[s].lastS) < 180000 || pinned.has(s)) {
                    sniperResults.push({ s, pNow, distWap, isS:(now-stats[s].lastS)<180000 });
                }
                allPool.push({ s, pNow, amp24h: (parseFloat(t.highPrice)-parseFloat(t.lowPrice))/parseFloat(t.openPrice), vol24h: parseFloat(t.quoteVolume) });
            }

            allPool.sort((a,b) => (b.amp24h * Math.log10(b.vol24h)) - (a.amp24h * Math.log10(a.vol24h)));
            const candidates = allPool.slice(0, 20);
            for(let item of candidates) { await getBaselines(item.s); }

            let finalTop10 = candidates.map(item => {
                const b = baselineData[item.s];
                if(!b) return { ...item, score: 0, status: "⚪ 載入中" };
                const t = tMap.get(item.s);
                const vScore = item.amp24h / (b.avgAmp || 0.01);
                const hScore = (parseInt(t.count) - stats[item.s].startTrades) / (b.avgTradesHr * (Math.max(1, (now - stats[item.s].hourStart)/3600000)) || 1);
                const isAbove = item.pNow > b.wap5d;
                const score = (vScore * 2.0) + (hScore * 1.0) + (isAbove ? 15 : 0);
                const gap = ((item.pNow / b.wap5d) - 1) * 100;
                return { ...item, vScore, hScore, status: isAbove ? "🔴 強" : "⚪ 補", score, gap };
            }).sort((a,b) => b.score - a.score).slice(0, 10);

            renderPotentials(finalTop10);
            render(sniperResults);
        } catch(e){}
    }

    function renderPotentials(list) {
        const l = document.getElementById('potential-list'); l.innerHTML = '';
        list.forEach(item => {
            const div = document.createElement('div');
            div.className = "bg-zinc-900/60 p-4 rounded-2xl border border-white/10 space-y-2";
            div.innerHTML = `
                <div class="flex justify-between items-center border-b border-white/5 pb-1">
                    <span class="font-black text-white text-xs uppercase italic">${item.s.replace('USDT','')}</span>
                    <span class="${item.status.includes('強')?'text-red-500':'text-zinc-500'} text-[9px] font-black tracking-widest uppercase">${item.status}</span>
                </div>
                <div class="flex justify-between items-end">
                    <div>
                        <div class="text-[8px] text-purple-400 font-bold">💓 SPEED</div>
                        <div class="data-header text-purple-500">${item.hScore ? item.hScore.toFixed(1)+'x' : '--'}</div>
                    </div>
                    <div>
                        <div class="text-[8px] text-blue-400 font-bold text-right">🌊 VOLAT</div>
                        <div class="data-header text-blue-500 text-right">${item.vScore?item.vScore.toFixed(1)+'x':'--'}</div>
                    </div>
                </div>
                <div class="flex justify-between text-[9px] pt-1">
                    <span class="text-zinc-600">$${item.pNow.toFixed(item.pNow<1?4:2)}</span>
                    <span class="${item.gap>0?'text-green-500':'text-red-500'} font-black">GAP: ${item.gap.toFixed(2)}%</span>
                </div>`;
            l.appendChild(div);
        });
    }

    function render(data) {
        const l = document.getElementById('list'); l.innerHTML = '';
        data.forEach(i => {
            const d = document.createElement('div'); d.className = `card p-5 rounded-2xl ${i.isS?'sniper-trigger':''}`;
            d.innerHTML = `<div class="flex justify-between text-white"><div><div class="text-xl font-black italic uppercase">${i.s.replace('USDT','')}</div><div class="text-green-500 text-[10px] mt-1 font-bold">WAP GAP: ${(i.distWap*100).toFixed(2)}%</div></div><div class="text-lg font-black">$${i.pNow.toFixed(i.pNow<1?4:2)}</div></div>`;
            l.appendChild(d);
        });
    }

    async function handleSearch(e){ if(e.key==='Enter'){ let k = e.target.value.toUpperCase(); if(!k) return; if(!k.endsWith('USDT')) k += 'USDT'; await getBaselines(k); pinned.add(k); e.target.value=''; addLog(k.replace('USDT',''), "LOCK"); }}
    function toggleFuel(){ SETTINGS.USE_FUEL=!SETTINGS.USE_FUEL; document.getElementById('fuelBtn').classList.toggle('active-fuel'); }
    refreshActiveList(); setInterval(refreshActiveList, 3600000); setInterval(update, 3000);
</script>
</body>
</html>
