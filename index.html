<!DOCTYPE html>
<html>
<head>
    <title>⚡ DRIVE SNIPER V5.1.1 - 原始分數版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'JetBrains Mono', monospace; }
        .card { background: #0a0a0a; border: 1px solid #1a3a1a; cursor: pointer; transition: all 0.2s; }
        .card:hover { border-color: #a855f7; }
        .pinned { border: 2px solid #3b82f6 !important; background: #081221 !important; }
        .active-launch { border: 2px solid #a855f7 !important; background: #1e1b4b !important; }
        .log-container::-webkit-scrollbar { width: 4px; }
        .log-container::-webkit-scrollbar-thumb { background: #333; }
        /* 調整原始分數顯示大小，避免數字太長擠爆 */
        .score-val { font-size: 1.5rem; font-weight: 900; line-height: 1; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="bg-zinc-900 p-4 rounded-xl mb-4 border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-black text-blue-500 italic uppercase tracking-tighter">⚡ Sniper V5.1.1 <span class="text-[10px] bg-blue-900 text-white px-2 py-0.5 rounded ml-2">RAW SCORE</span></h1>
                <input type="text" id="searchInput" placeholder="搜尋..." class="bg-black border border-zinc-800 px-3 py-1 rounded text-sm text-blue-400 outline-none w-40">
            </div>
            <div class="grid grid-cols-3 gap-4 text-[10px] uppercase font-bold">
                <div class="space-y-1">
                    <div class="flex justify-between text-red-500"><span>📉 Slope</span><span id="slp_val">-5%</span></div>
                    <input type="range" id="slp_range" min="-80" max="0" value="-5" class="w-full">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-yellow-500"><span>💯 Vacuum (Score Threshold)</span><span id="drv_val">60</span></div>
                    <input type="range" id="drv_range" min="0" max="100" value="60" class="w-full">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-blue-400"><span>⚡ Vol Boost</span><span id="vol_val">1.2x</span></div>
                    <input type="range" id="vol_range" min="10" max="50" value="12" class="w-full">
                </div>
            </div>
        </div>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto pr-2"></div>
    </div>

    <div class="w-80 bg-zinc-950 border-l border-zinc-800 flex flex-col">
        <div class="p-4 border-b border-zinc-800 font-black text-xs text-zinc-500 uppercase tracking-widest">System Logs</div>
        <div id="logs" class="log-container flex-1 overflow-y-auto p-4 space-y-2 text-[10px] font-mono"></div>
    </div>

    <script>
        const EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','BNXUSDT'];
        let stats = {}, pinned = new Set(), FILTER = { SLP: -0.05, DRV_SCORE: 60, VOL_RATIO: 1.2 };

        function addLog(msg, color="text-zinc-500") {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `border-l-2 border-zinc-800 pl-2 py-1 ${color}`;
            div.innerHTML = `<span class="text-zinc-700">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            logs.prepend(div);
            if (logs.children.length > 50) logs.lastChild.remove();
        }

        // 保留原有的計算邏輯僅供過濾使用，不影響顯示
        function calculateScore(d) {
            if (d < 1000) return Math.round((d / 1000) * 20);
            if (d < 5000) return Math.round(20 + ((d - 1000) / 4000) * 40);
            if (d < 15000) return Math.round(60 + ((d - 5000) / 10000) * 30);
            return Math.round(90 + Math.min(10, (d - 15000) / 5000));
        }

        async function update() {
            try {
                const [fRes, oRes] = await Promise.all([
                    fetch('https://fapi.binance.com/fapi/v1/premiumIndex'),
                    fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')
                ]);
                const fData = await fRes.json(), oData = await oRes.json();
                let results = [];
                const keyword = document.getElementById('searchInput').value.toUpperCase();

                fData.filter(c => c.symbol.endsWith('USDT') && !EXCLUDE.includes(c.symbol)).forEach(c => {
                    const s = c.symbol;
                    const ticker = oData.find(t => t.symbol === s);
                    if (!ticker) return;

                    const fNow = parseFloat(c.lastFundingRate), pNow = parseFloat(ticker.lastPrice), vNow = parseFloat(ticker.quoteVolume);
                    
                    if (!stats[s]) { 
                        stats[s] = { p: pNow, v: vNow, vHist: [vNow], frHist: [fNow], drvHist: [], startTime: Date.now() }; 
                        return; 
                    }

                    stats[s].vHist.push(vNow); if (stats[s].vHist.length > 30) stats[s].vHist.shift();
                    const avgVol = stats[s].vHist.reduce((a,b)=>a+b,0) / stats[s].vHist.length;
                    const volRatio = vNow / (avgVol || 1);

                    stats[s].frHist.push(fNow); if (stats[s].frHist.length > 30) stats[s].frHist.shift();
                    const slope = (fNow - stats[s].frHist[0]) / Math.abs(stats[s].frHist[0] || 0.0001);
                    const vDelta = Math.abs(vNow - stats[s].v);
                    const pDelta = Math.abs(pNow - stats[s].p) / stats[s].p;
                    const instDrv = vDelta > 0 ? (pDelta / vDelta) * 100000000 : 0;
                    
                    stats[s].drvHist.push(instDrv); if (stats[s].drvHist.length > 30) stats[s].drvHist.shift();
                    const avgDrv = stats[s].drvHist.reduce((a,b)=>a+b,0) / stats[s].drvHist.length;
                    
                    // --- 修改處：保留原始分數與轉換分數 ---
                    const rawScore = Math.round(avgDrv); 
                    const filterScore = calculateScore(avgDrv); // 用來判斷滑桿過濾

                    const isPinned = pinned.has(s);
                    const isHitting = (slope <= FILTER.SLP && filterScore >= FILTER.DRV_SCORE && volRatio >= FILTER.VOL_RATIO);
                    
                    if (isHitting || isPinned || (keyword && s.includes(keyword))) {
                        results.push({ 
                            s, slope, 
                            displayScore: rawScore.toLocaleString(), // 顯示千分位原始分數
                            price: pNow, volRatio, isPinned, 
                            sec: Math.floor((Date.now()-stats[s].startTime)/1000) 
                        });
                        if (isHitting && !isPinned && !stats[s].logged) {
                            addLog(`🚀 ${s.replace('USDT','')} 發動! Raw: ${rawScore}, Vol: ${volRatio.toFixed(1)}x`, "text-purple-400");
                            stats[s].logged = true;
                        }
                    } else {
                        stats[s].logged = false;
                    }
                    stats[s].p = pNow; stats[s].v = vNow;
                });

                const list = document.getElementById('list'); list.innerHTML = '';
                results.sort((a,b) => (b.isPinned - a.isPinned) || (b.volRatio - a.volRatio)).forEach(item => {
                    const div = document.createElement('div');
                    div.className = `card p-4 rounded-xl ${item.isPinned ? 'pinned' : (item.volRatio > 2.0 ? 'active-launch' : '')}`;
                    div.onclick = () => { pinned.has(item.s) ? pinned.delete(item.s) : pinned.add(item.s); };
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="text-white font-black text-xl flex items-center">
                                    ${item.isPinned ? '📌 ' : ''}${item.s.replace('USDT','')}
                                    <span class="ml-2 text-[9px] text-zinc-600 font-normal">⏱️ ${item.sec}s</span>
                                </div>
                                <div class="text-[10px] ${item.slope < 0 ? 'text-red-500' : 'text-zinc-500'} font-bold">SLP: ${(item.slope*100).toFixed(1)}% | $${item.price}</div>
                            </div>
                            <div class="text-right">
                                <div class="score-val ${item.volRatio > 2.0 ? 'text-purple-400' : 'text-yellow-500'}">${item.displayScore}</div>
                                <div class="text-[8px] text-zinc-600 font-black uppercase">Raw Vacuum</div>
                            </div>
                        </div>
                        <div class="mt-3 flex items-center space-x-2">
                            <div class="flex-1 bg-zinc-900 h-1.5 rounded-full overflow-hidden">
                                <div class="h-full bg-blue-500" style="width: ${Math.min(100, item.volRatio * 20)}%"></div>
                            </div>
                            <span class="text-blue-400 font-black text-xs">${item.volRatio.toFixed(1)}x</span>
                        </div>`;
                    list.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        const bindFilter = (id, valId, key, scale) => {
            document.getElementById(id).oninput = (e) => {
                let v = parseFloat(e.target.value);
                FILTER[key] = v / scale;
                document.getElementById(valId).innerText = (key==='VOL_RATIO'?(v/10).toFixed(1)+'x':v+(key==='DRV_SCORE'?'':'%'));
            };
        };
        bindFilter('slp_range', 'slp_val', 'SLP', 100);
        bindFilter('drv_range', 'drv_val', 'DRV_SCORE', 1);
        bindFilter('vol_range', 'vol_val', 'VOL_RATIO', 10);

        setInterval(update, 3000); update();
    </script>
</body>
</html>
